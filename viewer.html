.gp-quiz-feedback.is-warn { background: var(--bg-sunken); }
.gp-quiz-feedback p { margin: 6px 0 0; }

/* ---------------- responsive ---------------- */
@media (max-width: 1100px) {
  .gp-inspector { right: 12px; bottom: 78px; top: auto; max-height: 56vh; width: min(380px, calc(100vw - 24px)); }
  .gp-timeline { width: 300px; }
}
@media (max-width: 860px) {
  .gp-timeline {
    left: 8px; right: 8px; width: auto; top: auto; bottom: calc(66px + env(safe-area-inset-bottom));
    height: min(42vh, 340px);
  }
  .gp-timeline.is-collapsed { height: auto; }
  .gp-inspector { left: 8px; right: 8px; width: auto; bottom: calc(66px + env(safe-area-inset-bottom)); max-height: 52vh; }
  .gp-rec { left: 8px; right: 8px; transform: none; max-width: none; overflow-x: auto; border-radius: 16px; }
  .gp-rec-label, .gp-rec-count { display: none; }
  .gp-tb span { display: none; }
  .gp-tb { padding: 0 8px; }
  .gp-side {
    left: 8px; right: 8px; width: auto; top: auto;
    bottom: calc(74px + env(safe-area-inset-bottom)); max-height: 46vh;
  }
  .gp-vol { display: none; }
  .gp-progress { min-width: 40px; }
  .gp-title strong { max-width: 34vw; }
}
@media (max-width: 520px) {
  .gp-bottom { gap: 2px; padding: 6px 8px; }
  .gp-play { width: 38px; height: 38px; }
  .gp-chip { padding: 0 8px; }
}

@media (prefers-reduced-motion: reduce) {
  .gp-spotlight[data-animate="true"] .gp-spot-hole { animation: none; }
  .gp-start-card:hover, .gp-card:hover { transform: none; }
  .gp-progress-bar { transition: none; }
}

.gp-add-menu {
  position: fixed; z-index: 75; min-width: 220px; max-height: 60vh; overflow-y: auto;
  background: var(--bg-elevated); border: 1px solid var(--surface-border);
  border-radius: var(--r-md, 12px); box-shadow: var(--shadow-lg);
}
.gp-add-menu .menu-item { width: 100%; }

/* Keep the player's explanation panel clear of the playback controls. */
@media (max-width: 860px) {
  .gp-side { bottom: calc(96px + env(safe-area-inset-bottom)); max-height: 40vh; overflow-y: auto; }
  .gp-timeline.is-collapsed .gp-timeline-head { border-bottom: none; }
  .gp-timeline.is-collapsed { bottom: calc(66px + env(safe-area-inset-bottom)); }
}

/* css/responsive.css */
/* Cross-cutting responsive rules */
@media (max-width: 1024px) {
  :root { --content-max: 100%; }
}
@media (max-width: 860px) {
  :root { --header-h: 56px; }
  .site-header .container { gap: var(--sp-3); }
  .brand-sub { display: none; }
  .header-actions .hide-sm { display: none; }
}
@media (max-width: 640px) {
  :root { --fs-3xl: 26px; --fs-4xl: 32px; }
  .btn { height: 36px; }
  .btn-lg { height: 44px; }
  .page-head { padding: var(--sp-6) 0 var(--sp-4); }
  .modal-body { max-height: 66vh; }
  dialog.modal { width: 100vw; max-width: 100vw; border-radius: var(--r-xl) var(--r-xl) 0 0; margin: auto auto 0; max-height: 92vh; }
  dialog.modal[open] { animation: luma-sheet-up var(--dur-3) var(--ease-out); }
  @keyframes luma-sheet-up { from { transform: translateY(24px); opacity: .6; } to { transform: none; opacity: 1; } }
  .modal-foot { border-radius: 0; }
}
@media (max-width: 400px) {
  .container { padding: 0 12px; }
  .hero-points { gap: 6px 10px; }
}
/* Ultrawide: keep text readable */
@media (min-width: 1900px) {
  :root { --content-max: 1320px; }
}
/* Print */
@media print {
  .site-header, .site-footer, .viewer-toolbar, .sidebar, .mobile-bar, .annot-bar, .toast-host { display: none !important; }
  .workspace { background: #fff !important; overflow: visible !important; }
  .page-wrap { box-shadow: none !important; page-break-after: always; }
}
/* Touch devices: bigger targets */
@media (hover: none) {
  .tb-btn { min-width: 38px; height: 36px; }
  .menu-item { padding: 10px; }
  .side-item { padding: 10px; }
  .thumb { padding: 6px; }
}
/* Safe area */
@supports (padding: max(0px)) {
  .site-header { padding-left: env(safe-area-inset-left); padding-right: env(safe-area-inset-right); }
}

/* =========================================================================
   Mobile-first corrections (v1.2)
   ========================================================================= */

/* Toolbar: only the essentials on a phone; everything else lives in the ⋮ menu. */
@media (max-width: 700px) {
  .viewer-toolbar {
    padding-left: max(6px, env(safe-area-inset-left));
    padding-right: max(6px, env(safe-area-inset-right));
    padding-top: max(0px, env(safe-area-inset-top));
    gap: 2px;
    overflow: visible;      /* never clip the dropdown menus */
  }
  .viewer-toolbar .tb-home { display: inline-flex; }
  .viewer-toolbar .tb-collapse,
  .viewer-toolbar .tb-sep,
  .viewer-toolbar .tb-title { display: none !important; }
  /* the search field becomes its own bar instead of squeezing the toolbar */
  .viewer-toolbar .tb-search {
    position: fixed; left: 8px; right: 8px;
    top: calc(env(safe-area-inset-top) + 54px);
    z-index: 45; width: auto; max-width: none;
    padding: 5px 6px; gap: 6px;
    background: var(--bg-elevated);
    border: 1px solid var(--surface-border-strong);
    border-radius: var(--r-pill); box-shadow: var(--shadow-lg);
  }
  .viewer-toolbar .tb-search .input { width: auto; flex: 1 1 auto; min-width: 0; height: 36px; font-size: 16px; }
  .viewer-toolbar .tb-search .tb-btn { width: 40px; height: 40px; min-width: 40px; }
  .viewer-toolbar .tb-search .search-count { min-width: 54px; font-size: 11px; white-space: nowrap; }
  .viewer-toolbar .tb-search [data-act="search-close"] {
    background: var(--bg-sunken); border-radius: 50%; color: var(--text);
  }
  .viewer-toolbar .tb-zoom { min-width: 0; }
  .viewer-toolbar .tb-zoom .tb-btn,
  .viewer-toolbar .tb-zoom .zoom-btn { display: none; }
  .viewer-toolbar .tb-zoom .zoom-value {
    min-width: 40px; padding: 0 2px; height: 36px;
    font-size: 12px; color: var(--text-secondary);
  }
  .viewer-toolbar .tb-btn { width: 40px; height: 40px; }
  .viewer-toolbar .page-input { width: 34px; height: 34px; }
  .viewer-toolbar .page-total { display: none; }
  .viewer-toolbar .tb-nav { gap: 0; }
}

/* Annotation palette: a thumb-friendly sheet instead of a scrolling strip. */
@media (max-width: 860px) {
  .annot-bar {
    position: fixed; left: 8px; right: 8px; transform: none;
    top: auto; bottom: calc(66px + env(safe-area-inset-bottom));
    border-radius: var(--r-lg);
    flex-wrap: wrap; justify-content: center; gap: 4px;
    padding: 10px 8px 8px; max-height: 42dvh; overflow-y: auto;
    box-shadow: var(--shadow-lg); z-index: 40;
  }
  .annot-bar::before {
    content: ''; position: absolute; top: 4px; left: 50%; transform: translateX(-50%);
    width: 36px; height: 3px; border-radius: 2px; background: var(--surface-border-strong);
  }
  .annot-bar .tb-btn { width: 44px; height: 44px; border-radius: var(--r-md); }
  .annot-bar .tb-sep { display: none; }
  .annot-bar .swatches { gap: 6px; }
  .annot-bar .swatch { width: 26px; height: 26px; }
  .annot-bar input[type="range"] { width: 84px; }
}

/* Bottom bars respect the home indicator. */
.mobile-bar { padding-bottom: max(6px, env(safe-area-inset-bottom)); height: auto; min-height: 56px; }
.mobile-bar .tb-btn { width: 44px; height: 44px; }
.workspace { padding-bottom: calc(58px + env(safe-area-inset-bottom)); }

/* Dialogs become bottom sheets on small screens. */
@media (max-width: 640px) {
  dialog.modal {
    position: fixed; inset: auto 0 0 0; margin: 0; width: 100%; max-width: 100%;
    max-height: 88dvh; border-radius: var(--r-lg) var(--r-lg) 0 0;
    padding-bottom: max(var(--sp-4), env(safe-area-inset-bottom));
    animation: sheet-in var(--dur-3) var(--ease-out);
  }
  dialog.modal .modal-body { max-height: 62dvh; overflow-y: auto; }
  dialog.modal .modal-foot { flex-wrap: wrap; }
  dialog.modal .modal-foot .btn { flex: 1 1 auto; }
  @keyframes sheet-in { from { transform: translateY(14px); opacity: .6; } to { transform: none; opacity: 1; } }
}

/* Forms: 16px inputs stop iOS from zooming the page on focus. */
@media (pointer: coarse) {
  .form-input { font-size: max(11px, calc(16px / var(--form-scale, 1))) !important; }
}

/* Documentation: no page can be wider than the screen. */
@media (max-width: 860px) {
  .doc-body { min-width: 0; max-width: 100%; overflow-wrap: anywhere; }
  .doc-body table { display: block; width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .doc-body pre { max-width: 100%; overflow-x: auto; }
  .docs-layout { grid-template-columns: minmax(0, 1fr); }
  .docs-nav { flex-wrap: wrap; overflow-x: visible; min-width: 0; }
  .prose, .doc-body { min-width: 0; }
  .prose table, .doc-body table { display: block; width: 100%; max-width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .prose pre, .doc-body pre { max-width: 100%; overflow-x: auto; }
  .gen-grid { grid-template-columns: minmax(0, 1fr); }
  .gen-grid > *, .stack-4, .panel { min-width: 0; }
}

/* Small screens: tighter type and padding everywhere. */
@media (max-width: 420px) {
  .container { padding: 0 14px; }
  .hero h1 { font-size: clamp(1.9rem, 8vw, 2.4rem); }
  .tool-grid { grid-template-columns: 1fr; }
  .page-head h1 { font-size: 1.5rem; }
  .btn { height: 42px; }
}

/* Dropdown menus on a phone: a bottom sheet, always reachable. */
@media (max-width: 860px) {
  .menu-host { position: static; }
  .menu {
    position: fixed; left: 8px; right: 8px; top: auto;
    bottom: calc(70px + env(safe-area-inset-bottom));
    min-width: 0; width: auto; max-height: 58dvh; overflow-y: auto;
    border-radius: var(--r-lg); box-shadow: var(--shadow-lg); z-index: 60;
    transform-origin: bottom center;
  }
  .menu[data-open="true"] { animation: menu-sheet-in var(--dur-2) var(--ease-out); }
  @keyframes menu-sheet-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .menu-item { padding: 12px 14px; font-size: var(--fs-sm); }
}

/* Off-screen sections skip layout and paint until they are scrolled near. */
.tool-grid > *, .feature-grid > *, .docs-section, .footer-grid > * {
  content-visibility: auto;
  contain-intrinsic-size: auto 180px;
}

/* Mobile page counter: never wrap "/ 420" onto a second line. */
.mobile-bar .mb-page { flex-wrap: nowrap; white-space: nowrap; gap: 3px; }
.mobile-bar .mb-page .input { width: 40px; height: 32px; padding: 0 2px; }
.mobile-bar #mobile-total { font-size: 11px; letter-spacing: -.01em; }
.mobile-bar { gap: 2px; }

/* Toasts sit above the mobile bar (and the annotation sheet), never on top of them. */
@media (max-width: 860px) {
  .toast-host { bottom: calc(74px + env(safe-area-inset-bottom)); width: min(92vw, 420px); }
  .annot-bar[data-open="true"] ~ .toast-host,
  body:has(.annot-bar[data-open="true"]) .toast-host { bottom: calc(288px + env(safe-area-inset-bottom)); }
}

/* The zoom presets use the same sheet on a phone (the toolbar copy is a popover). */
@media (max-width: 860px) {
  .menu.zoom-menu-pop {
    display: block; position: fixed; left: 8px; right: 8px; top: auto !important;
    bottom: calc(70px + env(safe-area-inset-bottom));
    max-height: 56dvh; overflow-y: auto; border-radius: var(--r-lg);
    box-shadow: var(--shadow-lg); z-index: 60;
  }
}

</style>
<!-- critical-css:end -->
