<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Viewer — Luma PDF</title>
<meta name="description" content="Read, search, annotate and export PDFs in the browser. Nothing is uploaded.">
<meta name="theme-color" content="#fcfcfd">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/tokens.css?v=1.0.0">
<link rel="stylesheet" href="css/reset.css?v=1.0.0">
<link rel="stylesheet" href="css/themes.css?v=1.0.0">
<link rel="stylesheet" href="css/main.css?v=1.0.0">
<link rel="stylesheet" href="css/layout.css?v=1.0.0">
<link rel="stylesheet" href="css/viewer.css?v=1.0.0">
<link rel="stylesheet" href="css/toolbar.css?v=1.0.0">
<link rel="stylesheet" href="css/sidebar.css?v=1.0.0">
<link rel="stylesheet" href="css/annotations.css?v=1.0.0">
<link rel="stylesheet" href="css/animations.css?v=1.0.0">
<link rel="stylesheet" href="css/responsive.css?v=1.0.0">
<script>
  try {
    var s = JSON.parse(localStorage.getItem('luma.settings.v1') || '{}');
    var mode = s.theme || 'auto';
    var dark = mode === 'dark' || (mode === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    if (s.readBg) document.documentElement.dataset.readbg = s.readBg;
    if (s.pageFilter) document.documentElement.dataset.pagefilter = s.pageFilter;
    if (s.performanceProfile && s.performanceProfile !== 'auto') document.documentElement.dataset.performance = s.performanceProfile;
  } catch (e) {}
</script>
</head>
<body class="viewer-page">
<a class="skip-link" href="#workspace">Skip to document</a>

<h1 class="sr-only">PDF viewer</h1>
<div class="viewer-app" id="viewer-app">
  <header class="viewer-toolbar" id="toolbar" role="toolbar" aria-label="Viewer controls"></header>
  <div class="annot-bar" id="annot-bar" role="toolbar" aria-label="Annotation tools"></div>

  <div class="viewer-body">
    <div class="sidebar-scrim" id="sidebar-scrim"></div>

    <aside class="sidebar" id="sidebar" aria-label="Document panels">
      <div class="sidebar-head" role="tablist" aria-label="Document panels">
        <button class="sb-tab" role="tab" data-tab="thumbs" aria-selected="true" title="Page thumbnails">Pages</button>
        <button class="sb-tab" role="tab" data-tab="outline" aria-selected="false" title="Document outline">Outline</button>
        <button class="sb-tab" role="tab" data-tab="bookmarks" aria-selected="false" title="Bookmarks">Marks</button>
        <button class="sb-tab" role="tab" data-tab="annotations" aria-selected="false" title="Annotations">Notes</button>
        <button class="sb-tab" role="tab" data-tab="info" aria-selected="false" title="Document information">Info</button>
      </div>
      <div class="sidebar-body">
        <div class="sidebar-panel" data-panel="thumbs" data-active="true" id="panel-thumbs"></div>
        <div class="sidebar-panel" data-panel="outline" id="panel-outline"></div>
        <div class="sidebar-panel" data-panel="bookmarks" id="panel-bookmarks"></div>
        <div class="sidebar-panel" data-panel="annotations" id="panel-annotations"></div>
        <div class="sidebar-panel" data-panel="info" id="panel-info"></div>
      </div>
    </aside>

    <main class="workspace" id="workspace" tabindex="-1">
      <div class="read-progress" id="read-progress" aria-hidden="true"></div>
      <div class="page-stack" id="page-stack" data-mode="vertical"></div>

      <div class="viewer-status" id="status" role="status" aria-live="polite">
        <div class="status-card" id="status-card">
          <h2>Open a PDF to begin</h2>
          <p>Drop a file anywhere in this window, choose one from your device, or paste a link to a PDF.</p>
          <div class="status-actions">
            <button class="btn btn-primary" id="status-open">Choose a file</button>
            <button class="btn btn-outline" id="status-url">Open a link</button>
          </div>
          <p class="hint" style="margin-top:14px">Files are decoded on this device and never uploaded.</p>
        </div>
      </div>

      <div class="viewer-drop" id="viewer-drop">Drop your PDF to open it</div>
      <div class="page-pill" id="page-pill" data-visible="false">Page 1 of 1</div>

      <div class="mobile-bar" id="mobile-bar">
        <button class="tb-btn" data-mobile="prev" aria-label="Previous page">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <div class="mb-page">
          <input class="input" id="mobile-page" type="text" inputmode="numeric" value="1" aria-label="Page number">
          <span class="muted" id="mobile-total">/ 0</span>
        </div>
        <button class="tb-btn" data-mobile="next" aria-label="Next page">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
        <div class="grow"></div>
        <button class="tb-btn" data-mobile="search" aria-label="Search">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </button>
        <button class="tb-btn" data-mobile="annotate" aria-label="Annotate">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/></svg>
        </button>
        <button class="tb-btn" data-mobile="panel" aria-label="Panels">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/></svg>
        </button>
      </div>
    </main>
  </div>
</div>

<input type="file" id="file-input" accept="application/pdf,.pdf" hidden>
<div class="toast-host" aria-live="polite"></div>

<script src="vendor/pdfjs/pdf.min.js"></script>
<script src="vendor/pdf-lib/pdf-lib.min.js"></script>
<script type="module" src="js/pages/viewer.js?v=1.0.0"></script>
</body>
</html>
