<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Viewer — Luma PDF</title>
<meta name="description" content="Read, search, annotate and export PDFs in the browser. Nothing is uploaded.">
<meta name="theme-color" content="#fcfcfd">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<script>
  // Start fetching the document before the modules even parse.
  (function () {
    try {
      var src = new URLSearchParams(location.search).get('file');
      if (!src) return;
      var url = new URL(src, location.href);
      if (!/^https?:$/.test(url.protocol)) return;
      var link = document.createElement('link');
      link.rel = 'prefetch';
      link.as = 'fetch';
      link.href = url.href;
      link.crossOrigin = 'anonymous';
      document.head.appendChild(link);
    } catch (e) { /* ignore */ }
  })();
</script>

    var s = JSON.parse(localStorage.getItem('luma.settings.v1') || '{}');
    var mode = s.theme || 'auto';
    var dark = mode === 'dark' || (mode === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    if (s.readBg) document.documentElement.dataset.readbg = s.readBg;
    if (s.pageFilter) document.documentElement.dataset.pagefilter = s.pageFilter;
    if (s.performanceProfile && s.performanceProfile !== 'auto') document.documentElement.dataset.performance = s.performanceProfile;
  } catch (e) {}

<style>
/* css/tokens.css */
/* Luma PDF — design tokens */
:root {
  color-scheme: light;

  /* Brand */
  --brand-50: #f2effd;
  --brand-100: #e5dffb;
  --brand-200: #cfc4f7;
  --brand-300: #b2a1f1;
  --brand-400: #9278e8;
  --brand-500: #6e56cf;
  --brand-600: #5a44b0;
  --brand-700: #47358b;
  --amber-400: #f2b34b;
  --amber-500: #e19c2d;

  /* Neutrals (ink) */
  --ink-0: #ffffff;
  --ink-25: #fcfcfd;
  --ink-50: #f7f7f9;
  --ink-100: #f0f0f3;
  --ink-150: #e8e8ee;
  --ink-200: #dcdce4;
  --ink-300: #c3c3cf;
  --ink-400: #9797a8;
  --ink-500: #71717f;
  --ink-600: #55555f;
  --ink-700: #3f3f48;
  --ink-800: #292930;
  --ink-900: #17171c;
  --ink-950: #0d0d11;

  /* Semantic */
  --bg: var(--ink-25);
  --bg-elevated: var(--ink-0);
  --bg-sunken: var(--ink-50);
  --bg-hover: var(--ink-100);
  --bg-active: var(--ink-150);
  --surface-border: var(--ink-150);
  --surface-border-strong: var(--ink-200);
  --text: var(--ink-900);
  --text-secondary: var(--ink-600);
  --text-muted: var(--ink-500);
  --text-inverse: var(--ink-0);
  --accent: var(--brand-500);
  --accent-hover: var(--brand-600);
  --accent-soft: var(--brand-50);
  --accent-text: var(--brand-600);
  --danger: #d0453b;
  --danger-soft: #fdecea;
  --success: #2c7a52;
  --success-soft: #e7f5ee;
  --warning: #a26a12;
  --warning-soft: #fdf3e2;
  --focus-ring: color-mix(in srgb, var(--accent) 55%, transparent);

  /* Viewer workspace */
  --workspace: #e9e9ee;
  --workspace-pattern: #dfdfe6;
  --page-shadow: 0 1px 2px rgba(16, 16, 24, .08), 0 8px 24px -8px rgba(16, 16, 24, .18);

  /* Type */
  --font-sans: "Inter", ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --fs-2xs: 11px;
  --fs-xs: 12px;
  --fs-sm: 13px;
  --fs-base: 14px;
  --fs-md: 15px;
  --fs-lg: 17px;
  --fs-xl: 20px;
  --fs-2xl: 24px;
  --fs-3xl: 30px;
  --fs-4xl: 38px;
  --fs-5xl: clamp(34px, 5vw, 56px);
  --lh-tight: 1.15;
  --lh-snug: 1.35;
  --lh-normal: 1.55;
  --tracking-tight: -0.02em;
  --tracking-wide: 0.06em;

  /* Space */
  --sp-1: 4px;
  --sp-2: 8px;
  --sp-3: 12px;
  --sp-4: 16px;
  --sp-5: 20px;
  --sp-6: 24px;
  --sp-7: 32px;
  --sp-8: 40px;
  --sp-9: 56px;
  --sp-10: 80px;

  /* Radius */
  --r-xs: 4px;
  --r-sm: 6px;
  --r-md: 9px;
  --r-lg: 13px;
  --r-xl: 18px;
  --r-pill: 999px;

  /* Elevation */
  --shadow-xs: 0 1px 1px rgba(16, 16, 24, .04);
  --shadow-sm: 0 1px 2px rgba(16, 16, 24, .06), 0 1px 3px rgba(16, 16, 24, .04);
  --shadow-md: 0 4px 10px -2px rgba(16, 16, 24, .08), 0 2px 6px -2px rgba(16, 16, 24, .06);
  --shadow-lg: 0 18px 40px -12px rgba(16, 16, 24, .22), 0 6px 14px -8px rgba(16, 16, 24, .12);
  --shadow-pop: 0 24px 64px -16px rgba(12, 12, 20, .3);

  /* Motion */
  --ease-out: cubic-bezier(.22, .8, .28, 1);
  --ease-in-out: cubic-bezier(.6, .05, .28, 1);
  --dur-1: 90ms;
  --dur-2: 150ms;
  --dur-3: 220ms;
  --dur-4: 320ms;

  /* Layout */
  --header-h: 60px;
  --toolbar-h: 48px;
  --sidebar-w: 268px;
  --content-max: 1180px;
  --z-header: 40;
  --z-sidebar: 30;
  --z-sheet: 60;
  --z-dialog: 70;
  --z-toast: 80;
}

/* css/reset.css */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--font-sans);
  font-size: var(--fs-base);
  line-height: var(--lh-normal);
  color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  font-feature-settings: "kern" 1, "liga" 1, "cv11" 1;
  min-height: 100vh;
  min-height: 100dvh;
  overscroll-behavior-y: none;
}
h1, h2, h3, h4, h5, p, figure, blockquote, dl, dd { margin: 0; }
h1, h2, h3, h4 { font-weight: 620; letter-spacing: var(--tracking-tight); line-height: var(--lh-tight); }
ul, ol { margin: 0; padding: 0; list-style: none; }
img, svg, canvas, video { display: block; max-width: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
button { background: none; border: 0; cursor: pointer; }
a { color: var(--accent-text); text-decoration: none; }
a:hover { text-decoration: underline; text-underline-offset: 2px; }
code, kbd, pre, samp { font-family: var(--font-mono); font-size: .92em; }
table { border-collapse: collapse; width: 100%; }
[hidden] { display: none !important; }
::selection { background: color-mix(in srgb, var(--accent) 26%, transparent); }
:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; border-radius: var(--r-xs); }
input[type="range"] { accent-color: var(--accent); }
hr { border: 0; border-top: 1px solid var(--surface-border); margin: var(--sp-5) 0; }
::-webkit-scrollbar { width: 11px; height: 11px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: color-mix(in srgb, var(--ink-400) 55%, transparent); border-radius: var(--r-pill); border: 3px solid transparent; background-clip: content-box; }
::-webkit-scrollbar-thumb:hover { background: color-mix(in srgb, var(--ink-500) 70%, transparent); background-clip: content-box; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.skip-link { position: absolute; left: 12px; top: -48px; z-index: 100; background: var(--accent); color: #fff; padding: 10px 16px; border-radius: var(--r-md); transition: top var(--dur-2) var(--ease-out); }
.skip-link:focus { top: 12px; }

/* css/themes.css */
/* Theme: dark */
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0f0f13;
  --bg-elevated: #16161c;
  --bg-sunken: #0a0a0e;
  --bg-hover: #1e1e26;
  --bg-active: #262630;
  --surface-border: #26262f;
  --surface-border-strong: #33333f;
  --text: #ececf1;
  --text-secondary: #a9a9b8;
  --text-muted: #8b8b9a;
  --text-inverse: #0d0d11;
  --accent: #9b87f0;
  --accent-hover: #ab9bf4;
  --accent-soft: #211c36;
  --accent-text: #b3a2f5;
  --danger: #ef6b60;
  --danger-soft: #2c1614;
  --success: #58c08c;
  --success-soft: #10231a;
  --warning: #e0aa55;
  --warning-soft: #2a2113;
  --workspace: #08080b;
  --workspace-pattern: #101016;
  --page-shadow: 0 1px 2px rgba(0, 0, 0, .5), 0 10px 30px -10px rgba(0, 0, 0, .7);
  --shadow-lg: 0 18px 40px -12px rgba(0, 0, 0, .6), 0 6px 14px -8px rgba(0, 0, 0, .5);
  --shadow-pop: 0 24px 64px -16px rgba(0, 0, 0, .75);
}
/* Reading surfaces (viewer background preference) */
:root[data-readbg="light"] { --workspace: #e9e9ee; --workspace-pattern: #dfdfe6; }
:root[data-readbg="dark"] { --workspace: #08080b; --workspace-pattern: #101016; }
:root[data-readbg="sepia"] { --workspace: #efe6d4; --workspace-pattern: #e6dbc4; }
:root[data-readbg="slate"] { --workspace: #22252c; --workspace-pattern: #2b2f38; }
:root[data-readbg="paper"] { --workspace: #f6f4ef; --workspace-pattern: #ece8df; }
/* Sepia page treatment */
:root[data-pagefilter="sepia"] .page-canvas { filter: sepia(.28) saturate(.92) brightness(1.02); }
:root[data-pagefilter="contrast"] .page-canvas { filter: contrast(1.22) saturate(1.05); }
:root[data-pagefilter="invert"] .page-canvas { filter: invert(1) hue-rotate(180deg) contrast(.95); }
:root[data-pagefilter="dim"] .page-canvas { filter: brightness(.82) contrast(1.05); }
/* High contrast */
:root[data-contrast="high"] { --text-secondary: var(--text); --text-muted: var(--text); --surface-border: var(--surface-border-strong); }
:root[data-contrast="high"] .btn-ghost { border-color: var(--surface-border-strong); }
/* Reduced motion */
@media (prefers-reduced-motion: reduce) {
  :root { --dur-1: 1ms; --dur-2: 1ms; --dur-3: 1ms; --dur-4: 1ms; }
}
:root[data-motion="reduced"] { --dur-1: 1ms; --dur-2: 1ms; --dur-3: 1ms; --dur-4: 1ms; }
:root[data-motion="reduced"] * { animation-duration: 1ms !important; transition-duration: 1ms !important; }

/* css/main.css */
/* Luma PDF — base components */

/* ---------- Buttons ---------- */
.btn {
  --btn-bg: var(--bg-elevated);
  --btn-fg: var(--text);
  --btn-border: var(--surface-border-strong);
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  height: 38px; padding: 0 15px;
  font-size: var(--fs-sm); font-weight: 550; letter-spacing: .005em;
  border-radius: var(--r-md); border: 1px solid var(--btn-border);
  background: var(--btn-bg); color: var(--btn-fg);
  white-space: nowrap; user-select: none;
  transition: background var(--dur-2) var(--ease-out), border-color var(--dur-2) var(--ease-out),
              color var(--dur-2) var(--ease-out), transform var(--dur-1) var(--ease-out), box-shadow var(--dur-2) var(--ease-out);
}
.btn:hover { background: var(--bg-hover); }
.btn:active { transform: translateY(.5px) scale(.995); }
.btn[disabled], .btn[aria-disabled="true"] { opacity: .5; pointer-events: none; }
.btn .icon { width: 16px; height: 16px; flex: none; }
.btn-primary { --btn-bg: var(--accent); --btn-fg: #fff; --btn-border: transparent; box-shadow: 0 1px 2px rgba(16,16,24,.12); }
.btn-primary:hover { --btn-bg: var(--accent-hover); }
:root[data-theme="dark"] .btn-primary { --btn-fg: #14121f; }
.btn-ghost { --btn-bg: transparent; --btn-border: transparent; color: var(--text-secondary); }
.btn-ghost:hover { --btn-bg: var(--bg-hover); color: var(--text); }
.btn-outline { --btn-bg: transparent; }
.btn-danger { --btn-bg: transparent; --btn-fg: var(--danger); --btn-border: color-mix(in srgb, var(--danger) 40%, transparent); }
.btn-danger:hover { --btn-bg: var(--danger-soft); }
.btn-sm { height: 31px; padding: 0 11px; font-size: var(--fs-xs); border-radius: var(--r-sm); }
.btn-lg { height: 46px; padding: 0 22px; font-size: var(--fs-md); border-radius: var(--r-lg); }
.btn-icon { width: 36px; padding: 0; flex: none; }
.btn-icon.btn-sm { width: 30px; }
.btn-block { width: 100%; }
.btn .spinner { width: 14px; height: 14px; }

/* ---------- Inputs ---------- */
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.label { font-size: var(--fs-xs); font-weight: 560; color: var(--text-secondary); letter-spacing: .01em; }
.hint { font-size: var(--fs-xs); color: var(--text-muted); line-height: var(--lh-snug); }
.input, .select, .textarea {
  height: 38px; width: 100%; padding: 0 12px;
  font-size: var(--fs-sm); color: var(--text);
  background: var(--bg-elevated);
  border: 1px solid var(--surface-border-strong);
  border-radius: var(--r-md);
  transition: border-color var(--dur-2) var(--ease-out), box-shadow var(--dur-2) var(--ease-out), background var(--dur-2);
  appearance: none;
}
.textarea { height: auto; min-height: 84px; padding: 10px 12px; line-height: var(--lh-snug); resize: vertical; }
.input:hover, .select:hover, .textarea:hover { border-color: var(--ink-300); }
.input:focus, .select:focus, .textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--focus-ring); }
.input::placeholder, .textarea::placeholder { color: var(--text-muted); }
.select {
  background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%);
  background-position: calc(100% - 16px) 17px, calc(100% - 11px) 17px;
  background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; padding-right: 32px;
}
.input-sm { height: 31px; font-size: var(--fs-xs); padding: 0 9px; }
.input-group { display: flex; gap: 8px; align-items: center; }
.checkbox, .radio { display: inline-flex; align-items: center; gap: 9px; font-size: var(--fs-sm); color: var(--text-secondary); cursor: pointer; user-select: none; min-height: 28px; }
.checkbox input, .radio input { width: 16px; height: 16px; accent-color: var(--accent); margin: 0; flex: none; cursor: pointer; }
.switch { position: relative; display: inline-flex; align-items: center; gap: 10px; cursor: pointer; font-size: var(--fs-sm); color: var(--text-secondary); min-height: 30px; }
.switch input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
.switch .track { width: 36px; height: 21px; border-radius: var(--r-pill); background: var(--ink-300); position: relative; transition: background var(--dur-2) var(--ease-out); flex: none; }
.switch .track::after { content: ""; position: absolute; top: 2.5px; left: 2.5px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: var(--shadow-sm); transition: transform var(--dur-2) var(--ease-out); }
.switch input:checked + .track { background: var(--accent); }
.switch input:checked + .track::after { transform: translateX(15px); }
.switch input:focus-visible + .track { box-shadow: 0 0 0 3px var(--focus-ring); }

/* ---------- Surfaces ---------- */
.card {
  background: var(--bg-elevated);
  border: 1px solid var(--surface-border);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-xs);
}
.card-pad { padding: var(--sp-5); }
.panel { background: var(--bg-elevated); border: 1px solid var(--surface-border); border-radius: var(--r-lg); }
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3); padding: var(--sp-4) var(--sp-5); border-bottom: 1px solid var(--surface-border); }
.panel-body { padding: var(--sp-5); }
.panel-title { font-size: var(--fs-md); font-weight: 600; }
.divider { height: 1px; background: var(--surface-border); border: 0; margin: 0; }
.badge {
  display: inline-flex; align-items: center; gap: 5px; height: 21px; padding: 0 8px;
  font-size: var(--fs-2xs); font-weight: 600; letter-spacing: .04em; text-transform: uppercase;
  border-radius: var(--r-xs); background: var(--bg-active); color: var(--text-secondary);
}
.badge-accent { background: var(--accent-soft); color: var(--accent-text); }
.badge-success { background: var(--success-soft); color: var(--success); }
.badge-warn { background: var(--warning-soft); color: var(--warning); }
.badge-danger { background: var(--danger-soft); color: var(--danger); }
.kbd {
  display: inline-flex; align-items: center; justify-content: center; min-width: 20px; height: 20px; padding: 0 5px;
  font-family: var(--font-mono); font-size: 11px; color: var(--text-secondary);
  background: var(--bg-sunken); border: 1px solid var(--surface-border-strong); border-bottom-width: 2px; border-radius: var(--r-xs);
}
.muted { color: var(--text-muted); }
.small { font-size: var(--fs-xs); }
.mono { font-family: var(--font-mono); }
.truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.row { display: flex; align-items: center; gap: var(--sp-3); }
.row-between { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3); }
.col { display: flex; flex-direction: column; gap: var(--sp-3); }
.grow { flex: 1 1 auto; min-width: 0; }
.wrap { flex-wrap: wrap; }
.stack-4 { display: flex; flex-direction: column; gap: var(--sp-4); }
.stack-5 { display: flex; flex-direction: column; gap: var(--sp-5); }
.stack-6 { display: flex; flex-direction: column; gap: var(--sp-6); }

/* ---------- Spinner & progress ---------- */
.spinner {
  width: 18px; height: 18px; flex: none; border-radius: 50%;
  border: 2px solid color-mix(in srgb, currentColor 22%, transparent);
  border-top-color: currentColor;
  animation: luma-spin .7s linear infinite;
}
@keyframes luma-spin { to { transform: rotate(360deg); } }
.progress { height: 5px; border-radius: var(--r-pill); background: var(--bg-active); overflow: hidden; }
.progress > i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: inherit; transition: width var(--dur-3) var(--ease-out); }
.progress-indeterminate > i { width: 38% !important; animation: luma-indeterminate 1.1s var(--ease-in-out) infinite; }
@keyframes luma-indeterminate { 0% { transform: translateX(-100%); } 100% { transform: translateX(300%); } }

/* ---------- Toasts ---------- */
.toast-host { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: var(--z-toast); display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; width: min(94vw, 460px); }
.toast {
  pointer-events: auto; display: flex; align-items: flex-start; gap: 10px;
  width: 100%; padding: 11px 14px; font-size: var(--fs-sm);
  background: var(--ink-900); color: #f4f4f7; border-radius: var(--r-md);
  box-shadow: var(--shadow-lg); animation: luma-toast-in var(--dur-3) var(--ease-out);
  border: 1px solid rgba(255,255,255,.08);
}
.toast.leaving { animation: luma-toast-out var(--dur-2) var(--ease-in-out) forwards; }
.toast .toast-body { flex: 1; min-width: 0; }
.toast .toast-title { font-weight: 600; }
.toast .toast-msg { color: #c8c8d2; font-size: var(--fs-xs); margin-top: 2px; line-height: 1.45; word-break: break-word; }
.toast .toast-close { color: #9a9aa8; padding: 2px; border-radius: var(--r-xs); }
.toast .toast-close:hover { color: #fff; background: rgba(255,255,255,.1); }
.toast .toast-icon { margin-top: 1px; flex: none; }
.toast-success .toast-icon { color: #63d29b; }
.toast-error .toast-icon { color: #ff8f85; }
.toast-warn .toast-icon { color: var(--amber-400); }
@keyframes luma-toast-in { from { opacity: 0; transform: translateY(10px) scale(.98); } to { opacity: 1; transform: none; } }
@keyframes luma-toast-out { to { opacity: 0; transform: translateY(6px) scale(.98); } }

/* ---------- Dialog ---------- */
dialog.modal {
  padding: 0; border: 1px solid var(--surface-border); border-radius: var(--r-xl);
  background: var(--bg-elevated); color: var(--text); box-shadow: var(--shadow-pop);
  width: min(92vw, 520px); max-height: min(88vh, 780px);
  overflow: visible;
}
dialog.modal::backdrop { background: rgba(12, 12, 20, .5); backdrop-filter: blur(3px); }
dialog.modal[open] { animation: luma-dialog-in var(--dur-3) var(--ease-out); }
dialog.modal[open]::backdrop { animation: luma-fade-in var(--dur-3) var(--ease-out); }
@keyframes luma-dialog-in { from { opacity: 0; transform: translateY(8px) scale(.985); } to { opacity: 1; transform: none; } }
@keyframes luma-fade-in { from { opacity: 0; } to { opacity: 1; } }
.modal-head { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--sp-4); padding: var(--sp-5) var(--sp-5) var(--sp-3); }
.modal-title { font-size: var(--fs-lg); font-weight: 620; }
.modal-sub { font-size: var(--fs-sm); color: var(--text-muted); margin-top: 3px; }
.modal-body { padding: 0 var(--sp-5) var(--sp-4); overflow: auto; max-height: 62vh; }
.modal-foot { display: flex; justify-content: flex-end; gap: 8px; padding: var(--sp-4) var(--sp-5); border-top: 1px solid var(--surface-border); background: var(--bg-sunken); border-radius: 0 0 var(--r-xl) var(--r-xl); flex-wrap: wrap; }

/* ---------- Bottom sheet ---------- */
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: var(--z-sheet);
  background: var(--bg-elevated); border-top: 1px solid var(--surface-border);
  border-radius: var(--r-xl) var(--r-xl) 0 0; box-shadow: var(--shadow-pop);
  padding: var(--sp-3) var(--sp-4) calc(var(--sp-4) + env(safe-area-inset-bottom));
  transform: translateY(102%); transition: transform var(--dur-3) var(--ease-out);
  max-height: 72vh; overflow: auto;
}
.sheet[data-open="true"] { transform: none; }
.sheet-grip { width: 36px; height: 4px; border-radius: var(--r-pill); background: var(--surface-border-strong); margin: 2px auto var(--sp-3); }
.sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--sp-3); }
.sheet-title { font-weight: 600; font-size: var(--fs-md); }
.sheet-backdrop { position: fixed; inset: 0; z-index: calc(var(--z-sheet) - 1); background: rgba(10,10,16,.42); opacity: 0; pointer-events: none; transition: opacity var(--dur-3); }
.sheet-backdrop[data-open="true"] { opacity: 1; pointer-events: auto; }

/* ---------- Empty state ---------- */
.empty { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; padding: var(--sp-8) var(--sp-4); color: var(--text-muted); }
.empty .empty-icon { width: 44px; height: 44px; display: grid; place-items: center; border-radius: var(--r-lg); background: var(--bg-sunken); color: var(--text-muted); border: 1px solid var(--surface-border); }
.empty h3 { font-size: var(--fs-md); color: var(--text); font-weight: 600; }
.empty p { font-size: var(--fs-sm); max-width: 42ch; }

/* ---------- Tabs ---------- */
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--surface-border); overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  position: relative; padding: 10px 12px; font-size: var(--fs-sm); font-weight: 550; color: var(--text-muted);
  border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap;
  transition: color var(--dur-2), border-color var(--dur-2);
}
.tab:hover { color: var(--text); }
.tab[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); }
.segmented { display: inline-flex; padding: 3px; gap: 2px; background: var(--bg-sunken); border: 1px solid var(--surface-border); border-radius: var(--r-md); }
.segmented button { padding: 5px 11px; font-size: var(--fs-xs); font-weight: 550; color: var(--text-muted); border-radius: var(--r-sm); transition: background var(--dur-2), color var(--dur-2); }
.segmented button[aria-pressed="true"] { background: var(--bg-elevated); color: var(--text); box-shadow: var(--shadow-xs); }

/* ---------- Dropzone ---------- */
.dropzone {
  position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
  padding: var(--sp-7) var(--sp-5); text-align: center; cursor: pointer;
  border: 1.5px dashed var(--surface-border-strong); border-radius: var(--r-lg);
  background: var(--bg-elevated); color: var(--text-secondary);
  transition: border-color var(--dur-2), background var(--dur-2), transform var(--dur-2);
}
.dropzone:hover { border-color: var(--accent); background: var(--accent-soft); }
.dropzone.is-dragover { border-color: var(--accent); background: var(--accent-soft); transform: scale(1.005); }
.dropzone .dz-icon { width: 40px; height: 40px; display: grid; place-items: center; border-radius: var(--r-md); background: var(--accent-soft); color: var(--accent-text); }
.dropzone .dz-title { font-size: var(--fs-sm); font-weight: 600; color: var(--text); }
.dropzone .dz-sub { font-size: var(--fs-xs); color: var(--text-muted); }
.dropzone input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }

/* ---------- File list ---------- */
.file-row { display: flex; align-items: center; gap: 11px; padding: 10px 12px; border: 1px solid var(--surface-border); border-radius: var(--r-md); background: var(--bg-elevated); }
.file-row + .file-row { margin-top: 6px; }
.file-row .fr-icon { width: 30px; height: 30px; border-radius: var(--r-sm); display: grid; place-items: center; background: var(--accent-soft); color: var(--accent-text); flex: none; }
.file-row .fr-name { font-size: var(--fs-sm); font-weight: 550; }
.file-row .fr-meta { font-size: var(--fs-2xs); color: var(--text-muted); }
.file-row.dragging { opacity: .45; }
.file-row.drop-target { border-color: var(--accent); box-shadow: 0 0 0 2px var(--focus-ring); }

/* ---------- Icons ---------- */
.icon { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; display: block; }
.icon-sm { width: 15px; height: 15px; }
.icon-lg { width: 22px; height: 22px; }

/* css/layout.css */
/* App shell */
.app { display: flex; flex-direction: column; min-height: 100vh; min-height: 100dvh; }
.container { width: 100%; max-width: var(--content-max); margin: 0 auto; padding: 0 var(--sp-5); }
.container-wide { max-width: 1440px; }
.section { padding: var(--sp-9) 0; }
.section-tight { padding: var(--sp-7) 0; }

/* Header */
.site-header {
  position: sticky; top: 0; z-index: var(--z-header);
  height: var(--header-h); min-height: var(--header-h); display: flex; align-items: center;
  background: color-mix(in srgb, var(--bg) 86%, transparent);
  backdrop-filter: saturate(180%) blur(14px); -webkit-backdrop-filter: saturate(180%) blur(14px);
  border-bottom: 1px solid var(--surface-border);
}
.site-header .container { display: flex; align-items: center; gap: var(--sp-5); height: 100%; }
.brand { display: inline-flex; align-items: center; gap: 9px; color: var(--text); font-weight: 640; letter-spacing: var(--tracking-tight); font-size: var(--fs-md); flex: none; }
.brand:hover { text-decoration: none; }
.brand-mark { width: 28px; height: 28px; flex: none; }
.brand-sub { font-size: var(--fs-2xs); font-weight: 550; color: var(--text-muted); letter-spacing: .08em; text-transform: uppercase; padding: 2px 5px; border: 1px solid var(--surface-border); border-radius: var(--r-xs); }
.nav { display: flex; align-items: center; gap: 2px; }
.nav a {
  padding: 7px 11px; font-size: var(--fs-sm); font-weight: 500; color: var(--text-secondary);
  border-radius: var(--r-sm); transition: background var(--dur-2), color var(--dur-2);
}
.nav a:hover { background: var(--bg-hover); color: var(--text); text-decoration: none; }
.nav a[aria-current="page"] { color: var(--text); background: var(--bg-hover); font-weight: 560; }
.header-actions { display: flex; align-items: center; gap: 6px; margin-left: auto; }
.header-actions .btn { height: 33px; }

/* Footer */
.site-footer { margin-top: auto; border-top: 1px solid var(--surface-border); background: var(--bg-sunken); padding: var(--sp-7) 0 var(--sp-6); }
.footer-grid { display: grid; grid-template-columns: 1.6fr repeat(3, 1fr); gap: var(--sp-6); }
.footer-col h4 { font-size: var(--fs-2xs); text-transform: uppercase; letter-spacing: var(--tracking-wide); color: var(--text-muted); margin-bottom: 10px; font-weight: 600; }
.footer-col a, .footer-col span { display: block; font-size: var(--fs-sm); color: var(--text-secondary); padding: 3px 0; }
.footer-col a:hover { color: var(--text); }
.footer-bottom { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-4); margin-top: var(--sp-6); padding-top: var(--sp-4); border-top: 1px solid var(--surface-border); font-size: var(--fs-xs); color: var(--text-muted); flex-wrap: wrap; }
.build-stamp { font-family: var(--font-mono); font-size: 10.5px; color: var(--text-muted); opacity: .85; }

/* Page header block */
.page-head { padding: var(--sp-8) 0 var(--sp-6); border-bottom: 1px solid var(--surface-border); }
.page-head h1 { font-size: var(--fs-3xl); }
.page-head p { margin-top: 8px; color: var(--text-secondary); font-size: var(--fs-md); max-width: 62ch; }
.eyebrow { display: inline-flex; align-items: center; gap: 7px; font-size: var(--fs-2xs); font-weight: 650; letter-spacing: .1em; text-transform: uppercase; color: var(--accent-text); margin-bottom: 10px; }
.eyebrow::before { content: ""; width: 16px; height: 1.5px; background: currentColor; border-radius: 2px; }

/* Grids */
.grid { display: grid; gap: var(--sp-4); }
.grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.grid-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.grid-auto { grid-template-columns: repeat(auto-fill, minmax(232px, 1fr)); }

/* Docs layout */
.docs-layout { display: grid; grid-template-columns: 226px minmax(0, 1fr); gap: var(--sp-7); padding: var(--sp-7) 0 var(--sp-9); }
.docs-nav { position: sticky; top: calc(var(--header-h) + 20px); align-self: start; display: flex; flex-direction: column; gap: 2px; }
.docs-nav a { padding: 6px 10px; font-size: var(--fs-sm); color: var(--text-secondary); border-radius: var(--r-sm); }
.docs-nav a:hover { background: var(--bg-hover); color: var(--text); text-decoration: none; }
.docs-nav .docs-group { font-size: var(--fs-2xs); text-transform: uppercase; letter-spacing: .08em; color: var(--text-muted); font-weight: 650; margin: var(--sp-4) 0 4px; padding: 0 10px; }
.prose { max-width: 74ch; font-size: var(--fs-md); line-height: 1.68; color: var(--text-secondary); }
.prose h2 { font-size: var(--fs-xl); color: var(--text); margin: var(--sp-7) 0 var(--sp-3); scroll-margin-top: calc(var(--header-h) + 20px); }
.prose h3 { font-size: var(--fs-lg); color: var(--text); margin: var(--sp-6) 0 var(--sp-2); scroll-margin-top: calc(var(--header-h) + 20px); }
.prose p { margin: var(--sp-3) 0; }
.prose ul, .prose ol { margin: var(--sp-3) 0; padding-left: 20px; }
.prose ul { list-style: disc; }
.prose ol { list-style: decimal; }
.prose li { margin: 5px 0; }
.prose strong { color: var(--text); font-weight: 620; }
.prose code { background: var(--bg-sunken); border: 1px solid var(--surface-border); padding: 1px 5px; border-radius: var(--r-xs); font-size: .88em; color: var(--text); }
.prose table { font-size: var(--fs-sm); margin: var(--sp-4) 0; }
.prose th, .prose td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--surface-border); vertical-align: top; }
.prose th { font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: .04em; color: var(--text-muted); font-weight: 600; }
.prose a { font-weight: 500; }
.codeblock { position: relative; margin: var(--sp-4) 0; background: var(--ink-950); border: 1px solid var(--surface-border-strong); border-radius: var(--r-md); overflow: hidden; }
.codeblock pre { margin: 0; padding: 14px 16px; overflow-x: auto; font-size: var(--fs-xs); line-height: 1.65; color: #e6e6ef; }
.codeblock .copy-code { position: absolute; top: 7px; right: 7px; padding: 4px 8px; font-size: 11px; color: #b9b9c6; background: rgba(255,255,255,.07); border-radius: var(--r-xs); border: 1px solid rgba(255,255,255,.1); }
.codeblock .copy-code:hover { background: rgba(255,255,255,.14); color: #fff; }
.note { border-left: 3px solid var(--accent); background: var(--accent-soft); padding: 11px 14px; border-radius: 0 var(--r-sm) var(--r-sm) 0; font-size: var(--fs-sm); color: var(--text-secondary); margin: var(--sp-4) 0; }
.note.warn { border-left-color: var(--amber-500); background: var(--warning-soft); }

/* Utility: app view without footer */
.view-app .site-footer { display: none; }
@media (max-width: 900px) {
  .footer-grid { grid-template-columns: 1fr 1fr; }
  .docs-layout { grid-template-columns: 1fr; }
  .docs-nav { position: static; flex-direction: row; flex-wrap: wrap; }
  .docs-nav .docs-group { display: none; }
  .grid-4 { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .grid-3 { grid-template-columns: repeat(2, minmax(0,1fr)); }
}
@media (max-width: 640px) {
  .container { padding: 0 var(--sp-4); }
  .section { padding: var(--sp-7) 0; }
  .nav { display: none; }
  .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }
  .page-head h1 { font-size: var(--fs-2xl); }
  .footer-grid { grid-template-columns: 1fr; gap: var(--sp-5); }
}

/* css/viewer.css */
/* Viewer shell */
body.viewer-page { overflow: hidden; }
.viewer-app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; overflow: hidden; background: var(--bg); }
.viewer-app.is-fullscreen .viewer-toolbar { padding-top: 2px; }

.viewer-body { flex: 1; display: flex; min-height: 0; position: relative; }

/* Workspace */
.workspace {
  position: relative; flex: 1; min-width: 0; overflow: auto;
  background-color: var(--workspace);
  background-image: linear-gradient(180deg, color-mix(in srgb, var(--workspace) 88%, #000 4%), var(--workspace) 220px);
  background-repeat: no-repeat;
  background-attachment: local;
  scroll-behavior: auto;
  overscroll-behavior: contain;
  /* Native panning stays available; two-finger pinch is handled by the viewer. */
  touch-action: pan-x pan-y;
}
.workspace.no-pattern { background-image: none; }
.page-stack {
  display: flex; flex-direction: column; align-items: center;
  align-items: safe center;              /* falls back to flex-start when a page overflows */
  justify-content: flex-start;
  gap: var(--page-gap, 14px); padding: 18px 16px 64px; min-height: 100%;
  width: max-content; min-width: 100%;
}
.page-stack[data-mode="horizontal"] { flex-direction: row; align-items: center; justify-content: flex-start; padding: 18px 24px; gap: var(--page-gap, 14px); min-height: 100%; }
.page-stack[data-mode="spread"] { display: flex; flex-direction: column; align-items: center; gap: var(--page-gap, 14px); }
.spread-row { display: flex; align-items: flex-start; justify-content: center; gap: 6px; }
.page-stack[data-mode="single"] { justify-content: flex-start; }
.workspace[data-mode="horizontal"] { overflow-x: auto; overflow-y: hidden; }

/* Page */
.page-wrap { position: relative; flex: none; background: #fff; box-shadow: var(--page-shadow); border-radius: 2px; }
.page-wrap.is-loading::after {
  content: ""; position: absolute; inset: 0; border-radius: inherit;
  background: linear-gradient(100deg, #f4f4f7 20%, #fafafc 40%, #f4f4f7 60%);
  background-size: 200% 100%; animation: luma-shimmer 1.2s linear infinite;
}
:root[data-theme="dark"] .page-wrap { background: #1a1a20; }
@keyframes luma-shimmer { 0% { background-position: 130% 0; } 100% { background-position: -30% 0; } }
.page-canvas { display: block; border-radius: 2px; }
.page-canvas { transition: none; }
.page-skeleton { position: absolute; inset: 0; display: grid; place-items: center; color: var(--ink-300); }

/* Text layer */
.textLayer {
  position: absolute; inset: 0; overflow: hidden; opacity: 1;
  line-height: 1; text-size-adjust: none; forced-color-adjust: none;
  transform-origin: 0 0; z-index: 2; caret-color: transparent;
}
.textLayer span, .textLayer br {
  color: transparent; position: absolute; white-space: pre; cursor: text;
  transform-origin: 0% 0%; user-select: text;
}
.textLayer ::selection { background: color-mix(in srgb, var(--brand-400) 45%, transparent); }
.textLayer .endOfContent { display: block; position: absolute; inset: 100% 0 0; z-index: -1; cursor: default; user-select: none; }
.textLayer.selecting .endOfContent { top: 0; }

/* Search highlights */
.search-layer { position: absolute; inset: 0; z-index: 1; pointer-events: none; }
.search-hit { position: absolute; background: rgba(255, 205, 46, .45); border-radius: 2px; }
.search-hit.is-active { background: rgba(255, 158, 22, .6); box-shadow: 0 0 0 1.5px rgba(226, 122, 0, .75); }
:root[data-theme="dark"] .search-hit { background: rgba(255, 205, 46, .3); }
:root[data-theme="dark"] .search-hit.is-active { background: rgba(255, 168, 40, .5); }

/* Loading / empty / error overlay */
.viewer-status {
  position: absolute; inset: 0; z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: var(--sp-4); padding: var(--sp-6); text-align: center;
  background: color-mix(in srgb, var(--workspace) 88%, transparent);
  backdrop-filter: blur(6px);
}
.viewer-status[hidden] { display: none; }
.status-card { background: var(--bg-elevated); border: 1px solid var(--surface-border); border-radius: var(--r-lg); box-shadow: var(--shadow-lg); padding: var(--sp-6); max-width: 460px; width: 100%; }
.status-card h2 { font-size: var(--fs-lg); margin-bottom: 6px; }
.status-card p { font-size: var(--fs-sm); color: var(--text-secondary); line-height: 1.55; }
.status-card .status-actions { display: flex; gap: 8px; justify-content: center; margin-top: var(--sp-4); flex-wrap: wrap; }
.status-progress { width: 100%; max-width: 280px; margin: 0 auto; }
.status-code { font-family: var(--font-mono); font-size: var(--fs-xs); background: var(--bg-sunken); border: 1px solid var(--surface-border); padding: 8px 10px; border-radius: var(--r-sm); text-align: left; overflow-x: auto; color: var(--text-secondary); margin-top: var(--sp-3); white-space: pre-wrap; }

/* Drop overlay in viewer */
.viewer-drop {
  position: absolute; inset: 0; z-index: 25; display: none; place-items: center;
  background: color-mix(in srgb, var(--accent) 14%, transparent); backdrop-filter: blur(2px);
  border: 2px dashed var(--accent); border-radius: var(--r-md); margin: 10px;
  font-weight: 600; color: var(--accent-text);
}
.viewer-drop[data-active="true"] { display: grid; }

/* Panning (drag to move the document) */
.workspace.pan-mode { cursor: grab; }
.workspace.pan-ready { cursor: grab; }
.workspace.is-panning { cursor: grabbing; user-select: none; }
.workspace.is-panning * { user-select: none !important; }
.workspace.pan-mode .textLayer span { cursor: grab; }
.workspace.pan-mode .annotation-layer { pointer-events: none; }

/* Floating page indicator */
.page-pill {
  position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 15;
  display: inline-flex; align-items: center; gap: 7px; height: 30px; padding: 0 12px;
  font-size: var(--fs-xs); font-variant-numeric: tabular-nums; color: var(--text-inverse);
  background: color-mix(in srgb, var(--ink-900) 82%, transparent); backdrop-filter: blur(8px);
  border-radius: var(--r-pill); box-shadow: var(--shadow-md); opacity: 0; transition: opacity var(--dur-3) var(--ease-out);
  pointer-events: none;
}
:root[data-theme="dark"] .page-pill { background: color-mix(in srgb, #2a2a35 88%, transparent); color: #ececf1; }
.page-pill[data-visible="true"] { opacity: 1; }

/* Reading progress bar */
.read-progress { position: absolute; left: 0; top: 0; height: 2px; background: var(--accent); z-index: 18; width: 0; transition: width var(--dur-2) linear; opacity: .9; }

/* Presentation mode */
.viewer-app[data-presentation="true"] .viewer-toolbar,
.viewer-app[data-presentation="true"] .sidebar { display: none; }
.viewer-app[data-presentation="true"] .workspace { background: #08080b; }
/* Distraction free */
.viewer-app[data-zen="true"] .viewer-toolbar { opacity: 0; pointer-events: none; transform: translateY(-100%); transition: opacity var(--dur-3), transform var(--dur-3); }
.viewer-app[data-zen="true"]:hover .viewer-toolbar,
.viewer-app[data-zen="true"] .viewer-toolbar:focus-within { opacity: 1; pointer-events: auto; transform: none; }
.viewer-app[data-zen="true"] .sidebar { display: none; }

/* Mobile viewer bar */
.mobile-bar {
  display: none; position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
  background: color-mix(in srgb, var(--bg-elevated) 94%, transparent);
  backdrop-filter: blur(12px); border-top: 1px solid var(--surface-border);
  align-items: center; gap: 6px;
}
.mobile-bar .mb-page { display: flex; align-items: center; gap: 4px; font-size: var(--fs-xs); font-variant-numeric: tabular-nums; }
.mobile-bar .input { width: 46px; height: 30px; text-align: center; padding: 0 4px; }
.mobile-bar .btn { height: 34px; }

@media (max-width: 860px) {
  .mobile-bar { display: flex; }
  .workspace { padding-bottom: 54px; }
  .page-stack { padding: 10px 8px 70px; }
  .page-pill { display: none; }
}

/* Placeholder for pages that are not mounted yet: same box, no content. */
.page-ph {
  flex: none; border-radius: 2px;
  background: color-mix(in srgb, var(--workspace-pattern) 55%, transparent);
  box-shadow: var(--page-shadow);
  opacity: .55;
}

/* Fillable form fields (AcroForm) */
.form-layer {
  position: absolute; left: 0; top: 0; z-index: 4;
  transform-origin: 0 0; pointer-events: none;
}
.form-field { position: absolute; display: block; }
.form-input {
  width: 100%; height: 100%; box-sizing: border-box;
  border: calc(1px * var(--inv, 1)) solid color-mix(in srgb, var(--accent) 60%, transparent);
  background: color-mix(in srgb, var(--accent) 9%, #fff);
  color: #111; border-radius: calc(2px * var(--inv, 1));
  padding: 0 calc(2px * var(--inv, 1));
  font: inherit; line-height: 1.15; pointer-events: auto;
  -webkit-appearance: none; appearance: none;
}
.form-input:focus {
  outline: calc(2px * var(--inv, 1)) solid var(--accent);
  outline-offset: 0; background: #fff;
}
.form-input-checkbox, .form-input-radiogroup, .form-input-radio {
  width: 100%; height: 100%; accent-color: var(--accent); background: transparent; border: 0;
}
.form-input-dropdown, .form-input-optionlist { padding-right: 0; }
.form-layer .form-input:hover { background: color-mix(in srgb, var(--accent) 16%, #fff); }

/* Floating "fill and save" bar */
.form-bar {
  position: absolute; left: 50%; transform: translateX(-50%); bottom: 18px; z-index: 17;
  display: flex; align-items: center; gap: 8px; padding: 7px 8px 7px 14px;
  background: var(--bg-elevated); border: 1px solid var(--surface-border-strong);
  border-radius: var(--r-pill); box-shadow: var(--shadow-lg); font-size: var(--fs-xs);
}
.form-bar[hidden] { display: none; }
.form-bar .form-bar-text { color: var(--text-secondary); white-space: nowrap; }
@media (max-width: 860px) {
  .form-bar { bottom: 64px; font-size: 11px; }
}

/* A page that has no pixels yet shows a quiet skeleton, never a blank white sheet. */
.page-wrap:not(.rendered)::after {
  content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  background:
    linear-gradient(180deg, color-mix(in srgb, var(--ink-150) 55%, transparent), transparent 40%),
    linear-gradient(90deg, var(--ink-100) 0%, var(--ink-150) 50%, var(--ink-100) 100%);
  background-size: 100% 100%, 240% 100%;
  animation: page-skeleton 1.15s ease-in-out infinite;
  opacity: .85;
}
.page-wrap.rendered::after { content: none; }
@keyframes page-skeleton { 0% { background-position: 0 0, 120% 0; } 100% { background-position: 0 0, -120% 0; } }
:root[data-theme="dark"] .page-wrap.is-empty::after,
:root[data-theme="dark"] .page-wrap.is-loading::after {
  background: linear-gradient(90deg, #1c1c24 0%, #262630 50%, #1c1c24 100%);
  background-size: 240% 100%;
}
@media (prefers-reduced-motion: reduce) {
  .page-wrap.is-empty::after, .page-wrap.is-loading::after { animation: none; }
}

/* Distraction-free mode: an exit that works without a mouse. */
.zen-exit {
  position: fixed; top: calc(10px + env(safe-area-inset-top)); right: 12px; z-index: 70;
  display: inline-flex; align-items: center; gap: 4px;
  height: 36px; padding: 0 12px 0 10px;
  font-size: var(--fs-xs); font-weight: 550; color: var(--text-inverse);
  background: color-mix(in srgb, var(--ink-900) 82%, transparent);
  border: 1px solid rgba(255,255,255,.14); border-radius: var(--r-pill);
  box-shadow: var(--shadow-md); backdrop-filter: blur(8px);
  opacity: .92;
}
.zen-exit:hover { opacity: 1; }
.zen-exit svg { transform: rotate(180deg); }

/* css/toolbar.css */
/* Viewer toolbar */
.viewer-toolbar {
  display: flex; align-items: center; gap: 8px; flex: none;
  height: var(--toolbar-h); padding: 0 10px;
  background: var(--bg-elevated); border-bottom: 1px solid var(--surface-border);
  transition: opacity var(--dur-3) var(--ease-out), transform var(--dur-3) var(--ease-out);
  position: relative; z-index: 12;
}
.tb-group { display: flex; align-items: center; gap: 2px; }
.tb-sep { width: 1px; height: 20px; background: var(--surface-border); margin: 0 5px; flex: none; }
.tb-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 32px; min-width: 32px; padding: 0 7px; border-radius: var(--r-sm);
  color: var(--text-secondary); font-size: var(--fs-xs); font-weight: 500;
  transition: background var(--dur-1) var(--ease-out), color var(--dur-1);
  flex: none;
}
.tb-btn:hover { background: var(--bg-hover); color: var(--text); }
.tb-btn:active { background: var(--bg-active); }
.tb-btn[aria-pressed="true"], .tb-btn.is-active { background: var(--accent-soft); color: var(--accent-text); }
.tb-btn[disabled] { opacity: .4; pointer-events: none; }
.tb-btn .icon { width: 17px; height: 17px; }
.tb-title { display: flex; align-items: center; gap: 8px; min-width: 0; max-width: 26vw; }
.tb-title .doc-name { font-size: var(--fs-sm); font-weight: 560; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tb-title .doc-meta { font-size: 10.5px; color: var(--text-muted); white-space: nowrap; }
.tb-spacer { flex: 1 1 auto; min-width: 4px; }
.tb-page {
  display: flex; align-items: center; gap: 3px; padding: 0 3px;
  border: 1px solid var(--surface-border); border-radius: var(--r-sm); background: var(--bg-sunken);
}
.tb-page .input { width: 44px; height: 26px; text-align: center; padding: 0 2px; border: 0; background: transparent; font-size: var(--fs-xs); font-variant-numeric: tabular-nums; }
.tb-page .input:focus { box-shadow: none; }
.tb-page .page-total { font-size: var(--fs-xs); color: var(--text-muted); padding-right: 6px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tb-zoom { display: flex; align-items: center; }
.tb-zoom .zoom-value { min-width: 46px; height: 28px; font-size: var(--fs-xs); font-variant-numeric: tabular-nums; color: var(--text-secondary); border-radius: var(--r-sm); padding: 0 5px; }
.tb-zoom .zoom-value:hover { background: var(--bg-hover); color: var(--text); }

/* Dropdown menus */
.menu-host { position: relative; }
.menu {
  position: absolute; z-index: 50; top: calc(100% + 6px); right: 0; min-width: 208px;
  background: var(--bg-elevated); border: 1px solid var(--surface-border); border-radius: var(--r-md);
  box-shadow: var(--shadow-lg); padding: 5px; display: none;
}
.menu[data-open="true"] { display: block; animation: luma-menu-in var(--dur-2) var(--ease-out); }
.menu.left { right: auto; left: 0; }
@keyframes luma-menu-in { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
.menu-item {
  display: flex; align-items: center; gap: 9px; width: 100%; padding: 7px 9px; text-align: left;
  font-size: var(--fs-sm); color: var(--text-secondary); border-radius: var(--r-sm);
}
.menu-item:hover { background: var(--bg-hover); color: var(--text); }
.menu-item .icon { width: 15px; height: 15px; color: var(--text-muted); flex: none; }
.menu-item .mi-check { margin-left: auto; color: var(--accent); opacity: 0; }
.menu-item[aria-checked="true"] .mi-check { opacity: 1; }
.menu-item .mi-kbd { margin-left: auto; }
.menu-label { font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--text-muted); padding: 8px 9px 4px; font-weight: 650; }
.menu-sep { height: 1px; background: var(--surface-border); margin: 4px 2px; }

/* Search bar in toolbar */
.tb-search {
  display: none; align-items: center; gap: 4px; padding: 0 2px;
}
.tb-search[data-open="true"] { display: flex; }
.tb-search .input { width: 180px; height: 30px; font-size: var(--fs-xs); }
.tb-search .search-count { font-size: 11px; color: var(--text-muted); min-width: 46px; text-align: center; font-variant-numeric: tabular-nums; }
.tb-search .tb-btn { height: 28px; min-width: 26px; }

/* Annotation tool palette */
.annot-bar {
  display: none; align-items: center; gap: 2px; padding: 4px 6px;
  background: var(--bg-elevated); border-bottom: 1px solid var(--surface-border);
  overflow-x: auto; scrollbar-width: none; flex: none;
}
.annot-bar::-webkit-scrollbar { display: none; }
.annot-bar[data-open="true"] { display: flex; }
.annot-bar .tb-btn { height: 30px; }
.annot-bar .color-swatch { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--surface-border-strong); }
.annot-bar .color-swatch[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--bg-elevated), 0 0 0 3.5px var(--accent); }
.annot-bar input[type="range"] { width: 74px; }
.annot-bar .width-preview { width: 16px; display: grid; place-items: center; }

@media (max-width: 860px) {
  .viewer-toolbar { padding: 0 6px; gap: 4px; height: 46px; }
  /* Keep the essentials; the overflow menu carries the rest. */
  .viewer-toolbar [data-act="download"],
  .viewer-toolbar [data-act="fullscreen"],
  .viewer-toolbar [data-act="annotations"],
  .viewer-toolbar [data-act="zen"] { display: none; }
  /* Never clip controls: allow a horizontal scroll instead. */
  .viewer-toolbar { overflow-x: auto; overflow-y: hidden; scrollbar-width: none; }
  .viewer-toolbar::-webkit-scrollbar { display: none; }
  .tb-title { max-width: 34vw; }
  .tb-title .doc-meta { display: none; }
  .tb-hide-mobile { display: none !important; }
  .tb-search .input { width: 120px; }
  .tb-page .input { width: 38px; }
}
@media (max-width: 560px) {
  .tb-title { display: none; }
  .embed-toolbar .tb-title { display: none; }
}

/* css/sidebar.css */
/* Viewer sidebar */
.sidebar {
  flex: none; width: var(--sidebar-w); display: flex; flex-direction: column; min-height: 0;
  background: var(--bg-elevated); border-right: 1px solid var(--surface-border);
  transition: width var(--dur-3) var(--ease-out), transform var(--dur-3) var(--ease-out);
  overflow: hidden;
}
.sidebar[data-collapsed="true"] { width: 0; border-right: 0; }
.sidebar-head { display: flex; align-items: center; gap: 2px; padding: 6px 8px; border-bottom: 1px solid var(--surface-border); flex: none; }
.sidebar-head .sb-tab { flex: 1; padding: 6px 4px; font-size: var(--fs-xs); font-weight: 550; color: var(--text-muted); border-radius: var(--r-sm); }
.sidebar-head .sb-tab:hover { background: var(--bg-hover); color: var(--text); }
.sidebar-head .sb-tab[aria-selected="true"] { background: var(--bg-hover); color: var(--text); }
.sidebar-body { flex: 1; overflow: auto; padding: 10px; min-height: 0; }
.sidebar-panel { display: none; }
.sidebar-panel[data-active="true"] { display: block; }

/* Thumbnails */
.thumb-list { display: flex; flex-direction: column; gap: 8px; }
.thumb {
  position: relative; display: flex; gap: 8px; align-items: flex-start; padding: 4px; border-radius: var(--r-sm);
  border: 1.5px solid transparent; background: transparent; width: 100%; text-align: left;
  transition: border-color var(--dur-2), background var(--dur-2);
}
.thumb:hover { background: var(--bg-hover); }
.thumb[aria-current="true"] { border-color: var(--accent); background: var(--accent-soft); }
.thumb-canvas-wrap { position: relative; flex: none; background: #fff; border-radius: 2px; box-shadow: 0 1px 3px rgba(0,0,0,.16); overflow: hidden; min-width: 74px; min-height: 96px; display: grid; place-items: center; }
:root[data-theme="dark"] .thumb-canvas-wrap { background: #26262f; }
.thumb canvas { display: block; max-width: 100%; height: auto; }
.thumb-num { font-size: 10.5px; color: var(--text-muted); padding-top: 3px; font-variant-numeric: tabular-nums; flex: none; width: 18px; text-align: right; }
.thumb-skel { width: 74px; height: 96px; background: linear-gradient(100deg, #eee 20%, #f7f7f9 40%, #eee 60%); background-size: 200% 100%; animation: luma-shimmer 1.2s linear infinite; }

/* Outline */
.outline-list { display: flex; flex-direction: column; }
.outline-item {
  display: flex; align-items: center; gap: 6px; width: 100%; padding: 6px 8px; text-align: left;
  font-size: var(--fs-sm); color: var(--text-secondary); border-radius: var(--r-sm); line-height: 1.4;
}
.outline-item:hover { background: var(--bg-hover); color: var(--text); }
.outline-item .oi-page { margin-left: auto; font-size: 10.5px; color: var(--text-muted); font-variant-numeric: tabular-nums; }
.outline-children { padding-left: 12px; border-left: 1px solid var(--surface-border); margin-left: 8px; }

/* Bookmarks & annotations list */
.side-list { display: flex; flex-direction: column; gap: 4px; }
.side-item { display: flex; align-items: center; gap: 8px; padding: 7px 8px; border-radius: var(--r-sm); font-size: var(--fs-xs); color: var(--text-secondary); width: 100%; text-align: left; }
.side-item:hover { background: var(--bg-hover); color: var(--text); }
.side-item .icon { color: var(--text-muted); flex: none; }
.side-item .si-text { flex: 1; min-width: 0; }
.side-item .si-meta { font-size: 10.5px; color: var(--text-muted); }
.sidebar-empty { padding: 20px 10px; text-align: center; font-size: var(--fs-xs); color: var(--text-muted); line-height: 1.5; }

/* Document info panel */
.info-rows { display: flex; flex-direction: column; gap: 0; }
.info-row { display: flex; justify-content: space-between; gap: 10px; padding: 6px 2px; border-bottom: 1px solid var(--surface-border); font-size: var(--fs-xs); }
.info-row:last-child { border-bottom: 0; }
.info-row dt { color: var(--text-muted); flex: none; }
.info-row dd { color: var(--text-secondary); text-align: right; word-break: break-word; font-variant-numeric: tabular-nums; }

/* Mobile sidebar as sheet */
@media (max-width: 860px) {
  .sidebar {
    position: absolute; z-index: 30; top: 0; bottom: 0; left: 0; width: min(84vw, 320px);
    transform: translateX(-102%); box-shadow: var(--shadow-lg); border-right: 1px solid var(--surface-border);
  }
  .sidebar[data-open="true"] { transform: none; }
  .sidebar-body { padding-bottom: calc(58px + env(safe-area-inset-bottom)); }
  .sidebar[data-collapsed="true"] { width: min(84vw, 320px); }
  .sidebar-scrim { position: absolute; inset: 0; z-index: 29; background: rgba(10,10,16,.4); opacity: 0; pointer-events: none; transition: opacity var(--dur-3); }
  .sidebar-scrim[data-open="true"] { opacity: 1; pointer-events: auto; }
}

/* css/annotations.css */
/* Annotation layer — sized in page units and scaled by one transform, so zooming
   never rebuilds annotation nodes. */
.annotation-layer {
  position: absolute; left: 0; top: 0; z-index: 3;
  transform-origin: 0 0; touch-action: pan-x pan-y;
  will-change: transform;
}
.annotation-layer[data-mode="draw"],
.annotation-layer[data-mode="click"] { touch-action: none; }
.annotation-layer[data-mode="draw"] { cursor: crosshair; }
.annotation-layer[data-mode="text"] { cursor: text; }
.annotation-layer[data-mode="erase"] { cursor: not-allowed; }
.annotation-layer[data-mode="pan"] { pointer-events: none; }
.annot-item { position: absolute; pointer-events: none; }
.annotation-layer[data-selectable="true"] .annot-item { pointer-events: auto; cursor: move; }
.annot-hl { border-radius: 2px; }
.annot-underline { border-bottom-style: solid; }
.annot-strike { text-decoration: line-through; }
.annot-rect { border-style: solid; }
.annot-ellipse { border-radius: 50%; border-style: solid; }
.annot-svg { overflow: visible; }
.annot-text { white-space: pre-wrap; line-height: 1.35; }
.annot-note {
  width: 22px; height: 22px; border-radius: 4px 4px 4px 1px; display: grid; place-items: center;
  font-size: 11px; font-weight: 700; color: #fff; box-shadow: var(--shadow-sm); cursor: pointer;
}
.annot-note-pop {
  position: absolute; z-index: 6; min-width: 168px; max-width: 240px; padding: 8px 10px;
  transform: scale(var(--inv, 1)); transform-origin: top left;
  background: var(--warning-soft); color: var(--text); border: 1px solid color-mix(in srgb, var(--amber-500) 45%, transparent);
  border-radius: var(--r-sm); font-size: var(--fs-xs); line-height: 1.5; box-shadow: var(--shadow-md);
}
.annot-item[data-selected="true"] { outline: calc(1.5px * var(--inv, 1)) dashed var(--accent); outline-offset: calc(2px * var(--inv, 1)); }
.annot-handle {
  position: absolute; width: calc(9px * var(--inv, 1)); height: calc(9px * var(--inv, 1));
  background: #fff; border: calc(1.5px * var(--inv, 1)) solid var(--accent);
  border-radius: calc(2px * var(--inv, 1)); z-index: 4; display: none;
}
.annot-item[data-selected="true"] .annot-handle { display: block; }
.annot-handle[data-dir="se"] { right: calc(-5px * var(--inv, 1)); bottom: calc(-5px * var(--inv, 1)); cursor: nwse-resize; }
.annot-handle[data-dir="sw"] { left: calc(-5px * var(--inv, 1)); bottom: calc(-5px * var(--inv, 1)); cursor: nesw-resize; }
.annot-handle[data-dir="ne"] { right: calc(-5px * var(--inv, 1)); top: calc(-5px * var(--inv, 1)); cursor: nesw-resize; }
.annot-handle[data-dir="nw"] { left: calc(-5px * var(--inv, 1)); top: calc(-5px * var(--inv, 1)); cursor: nwse-resize; }
.annot-delete {
  position: absolute; top: calc(-11px * var(--inv, 1)); right: calc(-11px * var(--inv, 1));
  width: calc(20px * var(--inv, 1)); height: calc(20px * var(--inv, 1)); border-radius: 50%;
  font-size: calc(13px * var(--inv, 1)); line-height: 1;
  background: var(--danger); color: #fff; display: none; place-items: center; z-index: 5;
}
.annot-item[data-selected="true"] .annot-delete { display: grid; }
.annot-draft { position: absolute; pointer-events: none; z-index: 5; }
.annot-color-dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }

/* Signature pad */
.sig-pad { position: relative; border: 1px solid var(--surface-border-strong); border-radius: var(--r-md); background: #fff; overflow: hidden; touch-action: none; }
.sig-pad canvas { display: block; width: 100%; height: 160px; cursor: crosshair; touch-action: none; }
.sig-baseline { position: absolute; left: 16px; right: 16px; bottom: 34px; border-bottom: 1px dashed #c9c9d3; pointer-events: none; }

/* Annotation panel (editor side) */
.annot-toolbar-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
.annot-tool {
  display: grid; place-items: center; gap: 3px; aspect-ratio: 1; padding: 5px 2px;
  border: 1px solid var(--surface-border); border-radius: var(--r-sm); color: var(--text-secondary);
  background: var(--bg-elevated); transition: background var(--dur-2), color var(--dur-2), border-color var(--dur-2);
}
.annot-tool:hover { background: var(--bg-hover); color: var(--text); }
.annot-tool[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-text); }
.annot-tool span { font-size: 9px; letter-spacing: .01em; }

/* Signature library */
.sig-library .segmented { width: 100%; justify-content: space-between; }
.sig-library .segmented button { flex: 1; padding: 7px 10px; }
.sig-preview {
  margin-top: 12px; min-height: 84px; display: grid; place-items: center;
  border: 1px dashed var(--surface-border-strong); border-radius: var(--r-md);
  background: var(--bg-sunken); padding: 10px;
}
.sig-preview img { max-height: 90px; max-width: 100%; }
.sig-saved { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.sig-saved-item { position: relative; border: 1px solid var(--surface-border); border-radius: var(--r-md); background: #fff; padding: 6px; }
.sig-saved-pick { display: block; width: 100%; height: 66px; display: grid; place-items: center; }
.sig-saved-pick img { max-height: 60px; max-width: 100%; }
.sig-saved-del {
  position: absolute; top: -7px; right: -7px; width: 20px; height: 20px; border-radius: 50%;
  background: var(--danger); color: #fff; font-size: 13px; line-height: 1; display: grid; place-items: center;
  box-shadow: var(--shadow-sm);
}

/* css/animations.css */
/* Shared motion utilities */
.fade-in { animation: luma-fade-up var(--dur-3) var(--ease-out) both; }
@keyframes luma-fade-up { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.stagger > * { animation: luma-fade-up var(--dur-3) var(--ease-out) both; }
.stagger > *:nth-child(1) { animation-delay: 20ms; }
.stagger > *:nth-child(2) { animation-delay: 55ms; }
.stagger > *:nth-child(3) { animation-delay: 90ms; }
.stagger > *:nth-child(4) { animation-delay: 125ms; }
.stagger > *:nth-child(5) { animation-delay: 160ms; }
.stagger > *:nth-child(6) { animation-delay: 195ms; }
.stagger > *:nth-child(7) { animation-delay: 230ms; }
.stagger > *:nth-child(8) { animation-delay: 265ms; }
.press { transition: transform var(--dur-1) var(--ease-out); }
.press:active { transform: scale(.97); }
:root[data-performance="eco"] .stagger > * { animation: none; }
:root[data-performance="eco"] .hero::before { filter: none; opacity: .5; }
:root[data-performance="eco"] .btn, :root[data-performance="eco"] .tool-tile, :root[data-performance="eco"] .feature-card { transition-duration: 0ms; }
:root[data-performance="eco"] .page-wrap.rendered .page-canvas { animation: none; }

/* css/guidedpath.css */
/* ==========================================================================
   GuidedPath — dashboard, studio and player
   ========================================================================== */

.gp-page { padding-bottom: var(--sp-16, 96px); }

/* ---------------- dashboard ---------------- */
.gp-hero { padding: clamp(28px, 5vw, 56px) 0 8px; }
.gp-hero h1 { font-size: clamp(28px, 5vw, 44px); line-height: 1.1; letter-spacing: -.02em; margin: 10px 0 12px; }
.gp-hero .lede { color: var(--text-muted); max-width: 62ch; font-size: var(--fs-md, 16px); line-height: 1.65; }
.gp-hero code { font-size: .92em; padding: 2px 6px; border-radius: 6px; background: var(--bg-sunken); }

.gp-start { margin-top: 26px; }
.gp-start-grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }
.gp-start-card {
  display: flex; flex-direction: column; gap: 6px; align-items: flex-start; text-align: left;
  padding: 20px; border-radius: var(--r-lg, 16px); cursor: pointer;
  background: var(--bg-elevated); border: 1px solid var(--surface-border);
  color: var(--text); font: inherit; text-decoration: none;
  transition: transform var(--dur-2, .18s) var(--ease-out, ease), box-shadow var(--dur-2, .18s), border-color var(--dur-2, .18s);
}
.gp-start-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); border-color: var(--brand-300, #c9bcff); }
.gp-start-card:focus-visible { outline: 2px solid var(--brand-500, #6d4aff); outline-offset: 2px; }
.gp-start-card strong { font-size: var(--fs-md, 16px); }
.gp-start-card span:last-child { color: var(--text-muted); font-size: var(--fs-sm, 14px); }
.gp-start-icon {
  display: grid; place-items: center; width: 38px; height: 38px; border-radius: 12px;
  background: color-mix(in srgb, var(--brand-500, #6d4aff) 14%, transparent);
  color: var(--brand-600, #5a37e0); font-size: 18px; font-weight: 700; margin-bottom: 6px;
}

.gp-library { margin-top: 48px; }
.gp-library-head { display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-end; justify-content: space-between; margin-bottom: 16px; }
.gp-library-head h2 { font-size: var(--fs-lg, 22px); margin: 0 0 4px; }
.gp-library-tools { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.gp-search .input { width: min(240px, 52vw); }
.gp-sort { display: inline-flex; align-items: center; gap: 8px; }
.gp-sort .input { width: auto; }

.gp-cards { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(268px, 1fr)); }
.gp-card {
  display: flex; flex-direction: column; overflow: hidden;
  background: var(--bg-elevated); border: 1px solid var(--surface-border); border-radius: var(--r-lg, 16px);
  transition: box-shadow var(--dur-2, .18s), transform var(--dur-2, .18s);
}
.gp-card:hover { box-shadow: var(--shadow-md); transform: translateY(-1px); }
.gp-card-thumb {
  position: relative; aspect-ratio: 16 / 10; background: var(--bg-sunken);
  display: grid; place-items: center; overflow: hidden;
}
.gp-card-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.gp-card-thumb-empty { color: var(--text-muted); opacity: .5; }
.gp-card-badge {
  position: absolute; top: 8px; right: 8px; padding: 3px 8px; border-radius: 999px;
  background: color-mix(in srgb, var(--ink-900, #14141c) 78%, transparent); color: #fff;
  font-size: 11px; font-variant-numeric: tabular-nums;
}
.gp-card-body { padding: 12px 14px 4px; }
.gp-card-title { font-size: var(--fs-sm, 15px); margin: 0 0 4px; line-height: 1.35; }
.gp-card-doc { margin: 0; font-size: var(--fs-xs, 13px); color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gp-card-meta { margin: 6px 0 0; font-size: 11.5px; color: var(--text-muted); }
.gp-card-warn { margin: 6px 0 0; font-size: 11.5px; color: #b45309; }
.gp-card-actions { display: flex; align-items: center; gap: 6px; padding: 10px 12px 12px; flex-wrap: wrap; }
.gp-card-actions .btn { flex: 1 1 auto; }
.gp-empty-state { text-align: center; padding: 40px 12px; border: 1px dashed var(--surface-border); border-radius: var(--r-lg, 16px); }
.gp-empty-state h3 { margin: 0 0 6px; }

/* ---------------- shared bits ---------------- */
.gp-kicker { display: block; font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--text-muted); font-weight: 650; }
.gp-icon-btn {
  display: inline-grid; place-items: center; width: 32px; height: 32px; border-radius: 9px;
  border: 1px solid transparent; background: transparent; color: inherit; cursor: pointer;
}
.gp-icon-btn:hover { background: color-mix(in srgb, currentColor 10%, transparent); }
.gp-icon-btn:focus-visible { outline: 2px solid var(--brand-500, #6d4aff); outline-offset: 1px; }

/* ---------------- studio ---------------- */
body.gp-studio .viewer-app { padding-bottom: 76px; }
body.gp-studio .sidebar { display: none; }

.gp-rec {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(14px + env(safe-area-inset-bottom)); z-index: 60;
  display: flex; align-items: center; gap: 10px; padding: 8px 10px;
  background: color-mix(in srgb, var(--bg-elevated) 92%, transparent);
  backdrop-filter: blur(14px) saturate(1.2);
  border: 1px solid var(--surface-border); border-radius: 999px;
  box-shadow: var(--shadow-lg); max-width: calc(100vw - 20px);
}
.gp-rec-left { display: flex; align-items: center; gap: 8px; padding-left: 6px; }
.gp-rec-dot { width: 9px; height: 9px; border-radius: 50%; background: #9ca3af; flex: none; }
.gp-rec-dot[data-state="on"] { background: #ef4444; animation: gp-pulse 1.4s ease-in-out infinite; }
.gp-rec-dot[data-state="paused"] { background: #f59e0b; }
@keyframes gp-pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
.gp-rec-label { font-size: 12.5px; font-weight: 600; white-space: nowrap; }
.gp-rec-count { font-size: 11.5px; color: var(--text-muted); white-space: nowrap; }
.gp-rec-actions { display: flex; align-items: center; gap: 2px; }
.gp-tb {
  display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 10px;
  border: 1px solid transparent; border-radius: 999px; background: transparent;
  color: var(--text); font: inherit; font-size: 12.5px; cursor: pointer;
}
.gp-tb:hover { background: color-mix(in srgb, currentColor 9%, transparent); }
.gp-tb:focus-visible { outline: 2px solid var(--brand-500, #6d4aff); outline-offset: 1px; }
.gp-tb-primary { background: var(--brand-600, #5a37e0); color: #fff; }
.gp-tb-primary:hover { background: var(--brand-700, #4a2bc4); }
.gp-tb-sep { width: 1px; height: 20px; background: var(--surface-border); margin: 0 4px; }

.gp-timeline {
  position: fixed; top: 56px; right: 12px; bottom: 78px; width: 330px; z-index: 55;
  display: flex; flex-direction: column; overflow: hidden;
  background: color-mix(in srgb, var(--bg-elevated) 96%, transparent);
  backdrop-filter: blur(12px);
  border: 1px solid var(--surface-border); border-radius: var(--r-lg, 16px);
  box-shadow: var(--shadow-lg);
}
.gp-timeline.is-collapsed .gp-timeline-list,
.gp-timeline.is-collapsed .gp-timeline-foot { display: none; }
.gp-timeline-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 12px 12px 10px; border-bottom: 1px solid var(--surface-border); }
.gp-timeline-head strong { display: block; font-size: 13.5px; margin-top: 2px; }
.gp-timeline-list { flex: 1; overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 6px; }
.gp-timeline-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 10px; border-top: 1px solid var(--surface-border); }

.gp-step {
  display: grid; grid-template-columns: 22px 20px 1fr auto; gap: 8px; align-items: center;
  padding: 8px; border-radius: 10px; cursor: pointer;
  background: var(--bg-sunken); border: 1px solid transparent;
}
.gp-step:hover { border-color: var(--surface-border); }
.gp-step[data-selected="true"] { border-color: var(--brand-500, #6d4aff); background: color-mix(in srgb, var(--brand-500, #6d4aff) 9%, transparent); }
.gp-step.is-dragging { opacity: .45; }
.gp-step.is-over { border-color: var(--brand-500, #6d4aff); border-style: dashed; }
.gp-step-index { font-size: 11px; color: var(--text-muted); font-variant-numeric: tabular-nums; text-align: center; }
.gp-step-icon { display: grid; place-items: center; width: 20px; height: 20px; border-radius: 6px; color: var(--text); }
.gp-step[data-type="page"] .gp-step-icon { background: color-mix(in srgb, #3b82f6 16%, transparent); }
.gp-step[data-type="zoom"] .gp-step-icon, .gp-step[data-type="focus"] .gp-step-icon { background: color-mix(in srgb, #8b5cf6 16%, transparent); }
.gp-step[data-type="spotlight"] .gp-step-icon { background: color-mix(in srgb, #f59e0b 18%, transparent); }
.gp-step[data-type="text"] .gp-step-icon { background: color-mix(in srgb, #10b981 16%, transparent); }
.gp-step[data-type="narration"] .gp-step-icon { background: color-mix(in srgb, #ec4899 16%, transparent); }
.gp-step[data-type="quiz"] .gp-step-icon { background: color-mix(in srgb, #6366f1 16%, transparent); }
.gp-step[data-type="checkpoint"] .gp-step-icon { background: color-mix(in srgb, #14b8a6 16%, transparent); }
.gp-step[data-type="link"] .gp-step-icon { background: color-mix(in srgb, #0ea5e9 16%, transparent); }
.gp-step-body { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.gp-step-title { font-size: 12.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gp-step-meta { font-size: 10.5px; color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gp-step-actions { display: flex; gap: 0; opacity: 0; transition: opacity var(--dur-2, .18s); }
.gp-step:hover .gp-step-actions, .gp-step[data-selected="true"] .gp-step-actions, .gp-step:focus-within .gp-step-actions { opacity: 1; }
.gp-step-actions .gp-icon-btn { width: 24px; height: 24px; border-radius: 6px; }
.gp-empty { padding: 18px 10px; text-align: center; }

.gp-inspector {
  position: fixed; right: 354px; top: 56px; width: 340px; max-height: calc(100vh - 140px);
  z-index: 58; display: flex; flex-direction: column; overflow: hidden;
  background: var(--bg-elevated); border: 1px solid var(--surface-border);
  border-radius: var(--r-lg, 16px); box-shadow: var(--shadow-lg);
}
.gp-inspector-head { display: flex; align-items: center; justify-content: space-between; padding: 12px; border-bottom: 1px solid var(--surface-border); }
.gp-inspector-head strong { display: block; font-size: 13.5px; margin-top: 2px; }
.gp-inspector-body { padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
.gp-inspector-foot { display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--surface-border); }
.gp-inspector .field { display: flex; flex-direction: column; gap: 4px; }
.gp-inspector .label { font-size: 11.5px; color: var(--text-muted); }
.gp-fieldset { border: 1px solid var(--surface-border); border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.gp-fieldset legend { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--text-muted); padding: 0 4px; }
.gp-quiz-opts { display: flex; flex-direction: column; gap: 6px; }
.gp-quiz-opt { display: flex; align-items: center; gap: 6px; }
.gp-rec-live { display: flex; align-items: center; gap: 8px; padding: 8px; border-radius: 8px; background: var(--bg-sunken); }

.gp-pick { position: fixed; inset: 0; z-index: 80; background: color-mix(in srgb, #000 22%, transparent); cursor: crosshair; }
.gp-pick-box { position: fixed; display: none; border: 2px dashed #fff; background: color-mix(in srgb, #6d4aff 26%, transparent); border-radius: 6px; pointer-events: none; }
.gp-pick-hint {
  position: fixed; left: 50%; top: 16px; transform: translateX(-50%);
  background: color-mix(in srgb, var(--ink-900, #14141c) 88%, transparent); color: #fff;
  padding: 8px 14px; border-radius: 999px; font-size: 12.5px; margin: 0;
}

/* ---------------- player ---------------- */
body.gp-playing { overflow: hidden; }
body.gp-playing .viewer-toolbar,
body.gp-playing .annot-bar,
body.gp-playing .mobile-bar,
body.gp-playing .sidebar,
body.gp-playing .page-pill { display: none !important; }
body.gp-playing .viewer-app { padding: 0; }

.gp-stage { position: fixed; inset: 0; z-index: 70; pointer-events: none; }
.gp-stage > * { pointer-events: auto; }
.gp-top {
  position: absolute; top: 0; left: 0; right: 0; display: flex; align-items: center; gap: 14px;
  padding: calc(10px + env(safe-area-inset-top)) 16px 12px;
  background: linear-gradient(180deg, color-mix(in srgb, var(--ink-900, #14141c) 72%, transparent), transparent);
  color: #fff;
}
.gp-title { min-width: 0; }
.gp-title .gp-kicker { color: rgba(255, 255, 255, .7); }
.gp-title strong { font-size: 14px; font-weight: 600; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gp-progress { flex: 1; height: 4px; border-radius: 999px; background: rgba(255, 255, 255, .24); overflow: hidden; }
.gp-progress-bar { display: block; height: 100%; width: 0; background: #fff; transition: width .3s var(--ease-out, ease); }
.gp-counter { font-size: 12px; font-variant-numeric: tabular-nums; color: rgba(255, 255, 255, .85); white-space: nowrap; }
.gp-top .gp-icon-btn { color: #fff; }

.gp-bottom {
  position: absolute; left: 50%; transform: translateX(-50%);
  bottom: calc(14px + env(safe-area-inset-bottom));
  display: flex; align-items: center; gap: 4px; padding: 8px 10px;
  background: color-mix(in srgb, var(--ink-900, #14141c) 82%, transparent);
  backdrop-filter: blur(14px); border: 1px solid rgba(255, 255, 255, .12);
  border-radius: 999px; box-shadow: var(--shadow-lg); color: #fff;
}
.gp-bottom .gp-icon-btn { color: #fff; }
.gp-play {
  display: grid; place-items: center; width: 42px; height: 42px; border-radius: 50%;
  background: #fff; color: #14141c; border: none; cursor: pointer;
}
.gp-play:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
.gp-chip {
  height: 30px; padding: 0 10px; border-radius: 999px; border: 1px solid rgba(255, 255, 255, .2);
  background: transparent; color: #fff; font: inherit; font-size: 11.5px; cursor: pointer; font-variant-numeric: tabular-nums;
}
.gp-chip[aria-pressed="true"] { background: rgba(255, 255, 255, .22); }
.gp-sep { width: 1px; height: 20px; background: rgba(255, 255, 255, .18); margin: 0 4px; }
.gp-vol { display: inline-flex; align-items: center; gap: 6px; }
.gp-vol input { width: 72px; accent-color: #fff; }
.gp-vol-icon { display: inline-flex; opacity: .8; }

.gp-side {
  position: absolute; right: 18px; top: 76px; width: min(380px, 34vw); max-height: calc(100vh - 170px);
  overflow-y: auto; padding: 16px 18px;
  background: color-mix(in srgb, var(--bg-elevated) 96%, transparent);
  backdrop-filter: blur(16px); border: 1px solid var(--surface-border);
  border-radius: var(--r-lg, 16px); box-shadow: var(--shadow-lg);
  color: var(--text);
}
.gp-side-title { font-size: 17px; margin: 0 0 8px; line-height: 1.3; }
.gp-side-text { font-size: 14px; line-height: 1.65; }
.gp-side-text h3, .gp-side-text h4, .gp-side-text h5 { margin: 14px 0 6px; font-size: 14.5px; }
.gp-side-text p { margin: 0 0 10px; }
.gp-side-text ul, .gp-side-text ol { margin: 0 0 10px; padding-left: 20px; }
.gp-side-text a { color: var(--brand-600, #5a37e0); }
.gp-checkpoint { margin-top: 12px; padding: 12px; border-radius: 10px; background: var(--bg-sunken); }
.gp-checkpoint p { margin: 0 0 10px; font-size: 13.5px; }
.gp-external {
  display: flex; align-items: center; gap: 8px; margin-top: 12px; padding: 10px 12px;
  border-radius: 10px; border: 1px solid var(--surface-border); background: var(--bg-sunken);
  color: var(--text); text-decoration: none; font-size: 13px;
}
.gp-external-host { margin-left: auto; font-size: 11px; color: var(--text-muted); }
.gp-done h2 { margin: 0 0 6px; font-size: 18px; }
.gp-done p { margin: 0 0 12px; color: var(--text-muted); font-size: 13.5px; }
.gp-done-actions { display: flex; gap: 8px; }

.gp-caption {
  position: absolute; left: 50%; transform: translateX(-50%);
  bottom: calc(78px + env(safe-area-inset-bottom)); max-width: min(760px, 90vw);
  padding: 8px 14px; border-radius: 10px; text-align: center;
  background: color-mix(in srgb, var(--ink-900, #14141c) 86%, transparent); color: #fff;
  font-size: 13.5px; line-height: 1.5;
}
.gp-toast {
  position: absolute; left: 50%; transform: translateX(-50%);
  bottom: calc(140px + env(safe-area-inset-bottom)); padding: 8px 14px; border-radius: 999px;
  background: color-mix(in srgb, #b45309 92%, transparent); color: #fff; font-size: 12.5px; max-width: 90vw;
}

.gp-spotlight { position: fixed; z-index: 65; pointer-events: none; transition: opacity .35s var(--ease-out, ease); }
.gp-spotlight[data-ready="false"] { opacity: 0; }
.gp-spotlight-cut {
  position: absolute; inset: 0;
  background: rgba(4, 4, 10, var(--gp-spot-opacity, .55));
  -webkit-mask: linear-gradient(#000 0 0);
  mask: linear-gradient(#000 0 0);
}
.gp-spot-hole {
  position: absolute;
  border: var(--gp-spot-border, 2px) solid rgba(255, 255, 255, .92);
  box-shadow: 0 0 0 9999px rgba(4, 4, 10, var(--gp-spot-opacity, .55));
  background: transparent;
  -webkit-mask: none;
}
.gp-spotlight-cut { background: transparent; }
.gp-spotlight[data-animate="true"] .gp-spot-hole { animation: gp-spot-in .5s var(--ease-out, ease); }
@keyframes gp-spot-in { from { opacity: 0; transform: scale(.97); } to { opacity: 1; transform: none; } }

/* quiz */
.gp-quiz { margin-top: 4px; }
.gp-quiz-badge { font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--brand-600, #5a37e0); font-weight: 700; }
.gp-quiz-question { font-size: 14.5px; font-weight: 600; margin: 8px 0 12px; line-height: 1.4; }
.gp-quiz-options { display: flex; flex-direction: column; gap: 8px; }
.gp-quiz-option {
  display: flex; align-items: center; gap: 10px; padding: 11px 12px; text-align: left;
  border-radius: 10px; border: 1px solid var(--surface-border); background: var(--bg-sunken);
  color: var(--text); font: inherit; font-size: 13.5px; cursor: pointer;
}
.gp-quiz-option[aria-pressed="true"] { border-color: var(--brand-500, #6d4aff); background: color-mix(in srgb, var(--brand-500, #6d4aff) 10%, transparent); }
.gp-quiz-dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--surface-border-strong, #cfcfe0); flex: none; }
.gp-quiz-option[aria-pressed="true"] .gp-quiz-dot { border-color: var(--brand-600, #5a37e0); background: var(--brand-600, #5a37e0); box-shadow: inset 0 0 0 3px var(--bg-elevated); }
.gp-quiz-input { width: 100%; }
.gp-quiz-footer { display: flex; gap: 8px; margin-top: 12px; }
.gp-quiz-feedback { margin-top: 12px; padding: 10px 12px; border-radius: 10px; font-size: 13px; }
.gp-quiz-feedback.is-correct { background: color-mix(in srgb, #10b981 14%, transparent); }
.gp-quiz-feedback.is-wrong { background: color-mix(in srgb, #ef4444 12%, transparent); }
