<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Luma PDF Viewer</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#fcfcfd">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/tokens.css?v=1.1.0">
<link rel="stylesheet" href="css/reset.css?v=1.1.0">
<link rel="stylesheet" href="css/themes.css?v=1.1.0">
<link rel="stylesheet" href="css/main.css?v=1.1.0">
<link rel="stylesheet" href="css/layout.css?v=1.1.0">
<link rel="stylesheet" href="css/viewer.css?v=1.1.0">
<link rel="stylesheet" href="css/toolbar.css?v=1.1.0">
<link rel="stylesheet" href="css/sidebar.css?v=1.1.0">
<link rel="stylesheet" href="css/annotations.css?v=1.1.0">
<link rel="stylesheet" href="css/embed.css?v=1.1.0">
<link rel="stylesheet" href="css/responsive.css?v=1.1.0">
<script>
  // The embed never stores preferences: it renders exactly what the URL asks for.
  try {
    var p = new URLSearchParams(location.search);
    var t = p.get('theme') || 'auto';
    var dark = t === 'dark' || (t === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    var bg = p.get('background');
    if (bg) document.documentElement.dataset.readbg = bg;
  } catch (e) {}
</script>
</head>
<body class="embed-page">
<h1 class="sr-only">Embedded PDF viewer</h1>
<div class="embed-app" id="embed-app">
  <header class="embed-toolbar" id="embed-toolbar" role="toolbar" aria-label="Document controls"></header>
  <div class="viewer-body">
    <aside class="sidebar" id="embed-sidebar" data-collapsed="true" aria-label="Document panels">
      <div class="sidebar-head" role="tablist">
        <button class="sb-tab" role="tab" data-tab="thumbs" aria-selected="true">Pages</button>
        <button class="sb-tab" role="tab" data-tab="outline" aria-selected="false">Outline</button>
      </div>
      <div class="sidebar-body">
        <div class="sidebar-panel" data-panel="thumbs" data-active="true" id="embed-thumbs"></div>
        <div class="sidebar-panel" data-panel="outline" id="embed-outline"></div>
      </div>
    </aside>
    <main class="workspace" id="workspace" tabindex="-1">
      <div class="page-stack" id="page-stack" data-mode="vertical"></div>
      <div class="viewer-status" id="embed-status" hidden>
        <div class="status-card" id="embed-status-card"></div>
      </div>
      <div class="watermark-overlay" id="watermark" hidden></div>
      <div class="mobile-bar" id="embed-mobile">
        <button class="tb-btn" data-mobile="prev" aria-label="Previous page">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <div class="mb-page">
          <input class="input" id="mobile-page" type="text" inputmode="numeric" value="1" aria-label="Page number">
          <span class="muted" id="mobile-total">/ 0</span>
        </div>
        <button class="tb-btn" data-mobile="next" aria-label="Next page">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
        <div class="grow"></div>
        <button class="tb-btn" data-mobile="search" aria-label="Search">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </button>
        <button class="tb-btn" data-mobile="panel" aria-label="Pages panel">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/></svg>
        </button>
      </div>
    </main>
  </div>
</div>
<div class="toast-host" aria-live="polite"></div>

<script src="vendor/pdfjs/pdf.min.js"></script>
<script src="vendor/pdf-lib/pdf-lib.min.js"></script>
<script type="module" src="js/pages/embed.js?v=1.1.0"></script>
</body>
</html>
